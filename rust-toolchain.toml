# The toolchain Unluminous is built and checked with, so `cargo fmt --check` and `cargo clippy` mean
# the same thing on CI as they do on the machine this is developed on.
#
# `task-1922` found the workspace failing `cargo fmt --all -- --check` on 295 files while CI had never
# once run the check to completion. A formatting gate is only a gate if both ends agree on which
# rustfmt is running: rustfmt's output changes between releases, so "whatever is installed that day"
# is a check that passes here and fails there for a reason nobody can see. The version is written down
# once, here, and rustup installs it from this file on any machine that runs cargo in this folder --
# which is why the workflow does not name a version of its own.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
