<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editing code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rux/tokens.css">
<link rel="stylesheet" href="ds/rux/components/bundle.css">
<script src="ds/rux/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="unluminous-dark" style="width: 1180px; height: 740px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; background: var(--ul-editor); color: var(--ul-text); font-family: var(--font-ui);">
<x-import component-from-global-scope="Rux.UlTitleBar" project="unluminous" text-tools="{{no}}"></x-import>
<div style="display: flex; flex: 1; min-height: 0;">
<x-import component-from-global-scope="Rux.UlActivityBar" style="display: flex;"></x-import>
<x-import component-from-global-scope="Rux.UlExplorer" project="unluminous" rows="{{rows}}" footer="1,216 files · 775 can be opened" style="display: flex;"></x-import>
<div style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
<x-import component-from-global-scope="Rux.UlTabStrip" tabs="{{tabs}}"></x-import>
<x-import component-from-global-scope="Rux.UlEditor" code="{{code}}" caret-line="{{caret}}" breakpoints="{{breakpoints}}" style="display: flex; flex: 1; min-height: 0;"></x-import>
</div>
</div>
<x-import component-from-global-scope="Rux.UlStatusBar" items="{{status}}" right="Consolas · 14 pt"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":740}}'>
class Component extends DCLogic {
  renderVals() {
    const rust = { letter: 'R', colour: '#b7410e' };
    return {
      no: false,
      caret: 7,
      breakpoints: [12],
      rows: [
        { name: '.cargo', folder: true },
        { name: 'crates', folder: true, open: true },
        { name: 'unluminous-app', folder: true, open: true, depth: 1 },
        { name: 'examples', folder: true, depth: 2 },
        { name: 'plugins', folder: true, depth: 2 },
        { name: 'src', folder: true, open: true, depth: 2 },
        { name: 'app', folder: true, depth: 3 },
        { name: 'components', folder: true, depth: 3 },
        { name: 'services', folder: true, depth: 3 },
        { name: 'theme', folder: true, open: true, depth: 3 },
        { name: 'crisp.rs', depth: 4, badge: rust },
        { name: 'icon.rs', depth: 4, badge: rust, chosen: true, git: 'modified' },
        { name: 'mod.rs', depth: 4, badge: rust },
        { name: 'unluminous-core', folder: true, depth: 1 },
        { name: 'design', folder: true },
        { name: 'Cargo.toml', mark: 'page' },
        { name: 'CLAUDE.md', mark: 'prose' },
        { name: 'README.md', mark: 'prose' }
      ],
      tabs: [
        { name: 'icon.rs', active: true, badge: rust },
        { name: 'mod.rs', badge: rust },
        { name: 'style-guide.md' }
      ],
      code: [
        'pub fn more(painter: &egui::Painter, centre: Pos2, color: Color32) {',
        '    for step in [-4.5, 0.0, 4.5] {',
        '        painter.circle_filled(Pos2::new(centre.x, centre.y + step), 1.4, color);',
        '    }',
        '}',
        '',
        'pub fn plus(painter: &egui::Painter, centre: Pos2, color: Color32) {',
        '    let stroke = Stroke::new(1.5, color);',
        '    painter.line_segment(',
        '        [Pos2::new(centre.x - 4.0, centre.y), Pos2::new(centre.x + 4.0, centre.y)],',
        '        stroke,',
        '    );',
        '    painter.line_segment(',
        '        [Pos2::new(centre.x, centre.y - 4.0), Pos2::new(centre.x, centre.y + 4.0)],',
        '        stroke,',
        '    );',
        '}',
        '',
        '/// A circle with a plus in it, for the canvas zoom in button.',
        'pub fn zoom_in(painter: &egui::Painter, centre: Pos2, color: Color32) {',
        '    zoom_mark(painter, centre, color, true);',
        '}',
        '',
        '/// The same with a minus in it.',
        'pub fn zoom_out(painter: &egui::Painter, centre: Pos2, color: Color32) {',
        '    zoom_mark(painter, centre, color, false);',
        '}'
      ].join('\n'),
      status: ['icon.rs', 'Rust', 'LF', 'Ln 7, Col 5']
    };
  }
}
</script>
</body>
</html>
