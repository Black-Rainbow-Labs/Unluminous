</sc-if>

</sc-if>

      ].map((it) => ({ isSep: !!it.sep, isItem: !it.sep, label: it.label || '', shortcut: it.shortcut || '', bg: it.hover ? 'var(--well)' : 'transparent', shadow: it.hover ? 'inset 2px 2px 5px #0c0f13, inset -2px -2px 5px #2e343d' : 'none' })),
      fileMenu: F.map((it) => ({
        isSep: !!it.sep,
        isHeading: !!it.heading,
        isItem: !it.sep && !it.heading,
        heading: it.heading || '',
        label: it.label || '',
        shortcut: it.shortcut || '',
        disabled: !!it.disabled,
        opacity: it.disabled ? '0.4' : '1',
        tick: it.ticked ? '1' : '0',
        chev: it.submenu ? '1' : '0',
        pick: it.submenu ? () => this.setState({ openSub: subOpen ? '' : it.label }) : () => {},
        haspopup: it.submenu ? 'menu' : 'false',
        expanded: it.submenu && subOpen ? 'true' : 'false',
        chevColour: it.submenu && subOpen ? 'var(--ink-900)' : 'var(--ink-400)',
        chevMr: '0px',
        mr: '0px',
        radius: '10px',
        bg: it.submenu && subOpen ? 'rgba(255, 255, 255, 0.045)' : it.hover ? 'var(--well)' : 'transparent',
        shadow: it.submenu && subOpen ? 'none' : it.hover ? 'var(--in-sm)' : 'none'
      })),
      views: [{ label: 'Raw', d: I.raw }, { label: 'Side by side', d: I.split }, { label: 'Preview', d: I.preview }].map((v, i) => ({
        ...v,
        checked: i === view ? 'true' : 'false',
        bg: i === view ? 'var(--chip)' : 'transparent',
        shadow: i === view ? 'var(--out-sm)' : 'none',
        colour: i === view ? 'var(--ink-900)' : 'var(--ink-400)',
        pick: () => this.setState({ view: i })
      })),
      railTop: rail([
        { id: 'explorer', icon: 'project', label: 'Project' },
        { id: 'editor', icon: 'editor', label: 'Editing Area' },
        { id: 'git', icon: 'git', label: 'Git' },
        { id: 'realm', icon: 'realm', label: 'Realm' },
        { id: 'chat', icon: 'chat', label: 'Agent-Chat' },
        { id: 'tasks', icon: 'tasks', label: 'Agent-Tasks' },
        { id: 'database', icon: 'database', label: 'Database' }
      ]),
      railBottom: rail([
        { id: 'debug', icon: 'bug', label: 'Debug tile' },
        { id: 'run', icon: 'run', label: 'Run tile' },
        { id: 'terminal', icon: 'terminal', label: 'Terminal tile' }
      ]),
      showExplorer: !!on.explorer,
      caret: 7,
      breakpoints: [12],
      rows: [
        { name: '.cargo', folder: true },
        { name: 'crates', folder: true, open: true },
        { name: 'unluminous-app', folder: true, open: true, depth: 1 },
        { name: 'examples', folder: true, depth: 2 },
        { name: 'plugins', folder: true, depth: 2 },
        { name: 'src', folder: true, open: true, depth: 2 },
        { name: 'app', folder: true, depth: 3 },
        { name: 'components', folder: true, depth: 3 },
        { name: 'services', folder: true, depth: 3 },
        { name: 'theme', folder: true, open: true, depth: 3 },
        { name: 'crisp.rs', depth: 4, badge: { letter: 'R', colour: '#b7410e' } },
        { name: 'icon.rs', depth: 4, badge: { letter: 'R', colour: '#b7410e' }, chosen: true, git: 'modified' },
        { name: 'mod.rs', depth: 4, badge: { letter: 'R', colour: '#b7410e' } },
        { name: 'unluminous-core', folder: true, depth: 1 },
        { name: 'design', folder: true },
        { name: 'Cargo.toml', mark: 'page' },
        { name: 'CLAUDE.md', mark: 'prose' },
        { name: 'README.md', mark: 'prose' }
      ],
      tabs: [
        { name: 'icon.rs', active: true, badge: { letter: 'R', colour: '#b7410e' } },
        { name: 'mod.rs', badge: { letter: 'R', colour: '#b7410e' } },
        { name: 'style-guide.md' }
      ],
      code: [
        'pub fn more(painter: &egui::Painter, centre: Pos2, color: Color32) {',
        '    for step in [-4.5, 0.0, 4.5] {',
        '        painter.circle_filled(Pos2::new(centre.x, centre.y + step), 1.4, color);',
        '    }',
        '}',
        '',
        'pub fn plus(painter: &egui::Painter, centre: Pos2, color: Color32) {',
        '    let stroke = Stroke::new(1.5, color);',
        '    painter.line_segment(',
        '        [Pos2::new(centre.x - 4.0, centre.y), Pos2::new(centre.x + 4.0, centre.y)],',
        '        stroke,',
        '    );',
        '    painter.line_segment(',
        '        [Pos2::new(centre.x, centre.y - 4.0), Pos2::new(centre.x, centre.y + 4.0)],',
        '        stroke,',
        '    );',
        '}',
        '',
        '/// A circle with a plus in it, for the canvas zoom in button.',
        'pub fn zoom_in(painter: &egui::Painter, centre: Pos2, color: Color32) {',
        '    zoom_mark(painter, centre, color, true);',
        '}'
      ].join('\n'),
      status: ['icon.rs', 'Rust', 'LF', 'Ln 7, Col 5']
    };
  }
