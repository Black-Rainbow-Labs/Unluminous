<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realm whiteboard shapes</title>
<style>
  /* Unluminous Dark as rux draws it. rux::theme::Chat::lit_from(#1f232a) gives the surfaces, the two
     shadow tones and the action gradient; the text ladder and the accent are Unluminous Dark's palette,
     which theme::rux_theme puts in place of rux's own ink. Same values as the canvas's ChatPane design. */
  :root {
    --ground: #1f232a;
    --card: linear-gradient(145deg, #252a32, #1c2026);
    --chip: linear-gradient(145deg, #262b33, #20242b);
    --well: #1a1e24;
    --lit: #2a2f37;
    --dark: #0c0f13;
    --out: -7px -7px 16px #2a2f37, 8px 8px 18px #0c0f13;
    --out-sm: -4px -4px 9px #2a2f37, 4px 4px 10px #0c0f13;
    --in: inset 5px 5px 10px #0c0f13, inset -5px -5px 10px #2a2f37;
    --in-sm: inset 2px 2px 5px #0c0f13, inset -2px -2px 5px #2a2f37;
    --lifted: -6px -6px 16px rgba(42, 47, 55, 0.5), 0 30px 60px rgba(0, 0, 0, 0.6);
    --grad: linear-gradient(135deg, #3d78ff, #5cb6ff);
    --grad-out: -4px -4px 9px #2a2f37, 4px 5px 12px rgba(20, 60, 160, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    --chip-edge: inset 0 0 0 1px rgba(255, 255, 255, 0.045), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    --sky: #5cb6ff;
    --accent: #489ff8;
    --text-strong: #ffffff;
    --text: #e8ebf1;
    --text-control: #c8cedb;
    --text-dim: #8b93a3;
    --text-faint: #78808f;
    --port-off: #6c7483;
    --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    --mono: "Cascadia Mono", Consolas, "SF Mono", monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--ground); color: var(--text); font-family: var(--font); font-size: 13px; user-select: none; }

  /* ------------------------------------------------------------------- realm bar (task-2250's 50 points) */
  .realm-bar {
    position: absolute; inset: 0 0 auto 0; height: 50px; z-index: 50;
    display: flex; align-items: center; gap: 12px; padding: 0 14px;
    background: var(--ground); box-shadow: inset 0 -1px 0 var(--dark), 0 1px 0 var(--lit);
  }
  .track { display: flex; align-items: center; gap: 2px; padding: 3px; height: 34px; border-radius: 999px; background: var(--well); box-shadow: var(--in-sm); }
  .track .pill { height: 28px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; color: var(--text-dim); font-size: 12.5px; cursor: default; }
  .track .pill.on { color: var(--text); background: var(--chip); box-shadow: var(--out-sm), var(--chip-edge); }
  .chip {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 0; font: inherit; cursor: pointer;
    background: var(--chip); color: var(--text-control); box-shadow: var(--out-sm), var(--chip-edge);
  }
  .chip:hover { color: var(--text-strong); }
  .chip:active { box-shadow: var(--in-sm); }
  .chip.action { width: auto; padding: 0 16px; border-radius: 999px; gap: 6px; display: flex; align-items: center; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--grad); box-shadow: var(--grad-out); }
  .spacer { flex: 1; }
  .zoom-read { width: 52px; text-align: center; color: var(--text-dim); font-variant-numeric: tabular-nums; }

  /* -------------------------------------------------------------------------------------- canvas */
  .canvas {
    position: absolute; inset: 50px 0 0 0; overflow: hidden; cursor: default;
    background: radial-gradient(1200px 520px at 70% 110%, rgba(12, 15, 19, 0.5), transparent 70%), linear-gradient(180deg, #252a31 0%, #21252c 55%, #1c2026 100%);
  }
  .canvas.panning { cursor: grabbing; }
  .dunes { position: absolute; inset: auto 0 0 0; height: 46%; pointer-events: none; opacity: 0.6; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .wires path { fill: none; stroke: rgba(72, 159, 248, 0.6); stroke-width: 2; }

  /* ------------------------------------------------------------------------ the existing node kinds */
  .node { position: absolute; border-radius: 16px; background: var(--card); box-shadow: var(--out); }
  .node.chosen { box-shadow: var(--out), inset 0 0 0 1.5px var(--accent); }
  .node .caption {
    position: absolute; left: 4px; bottom: calc(100% + 10px); white-space: nowrap; pointer-events: none;
    font-size: 11px; color: var(--text-dim); padding: 4px 12px; border-radius: 999px; background: var(--well); box-shadow: var(--in-sm);
  }
  .node .caption b { color: var(--text-control); font-weight: 600; }
  .node .head { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px; box-shadow: 0 1px 0 var(--dark), 0 2px 0 var(--lit); cursor: grab; }
  .node .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--well); box-shadow: var(--in-sm); color: var(--sky); font-size: 10px; }
  .node .name { font-weight: 600; font-size: 12px; flex: 1; color: var(--text-strong); }
  .node .tools { display: flex; gap: 8px; color: var(--text-dim); font-size: 12px; }
  .node .body { padding: 14px 10px; font-family: var(--mono); font-size: 11px; color: var(--text-control); line-height: 1.5; }
  .node .body .ln { color: var(--text-faint); display: inline-block; width: 26px; }

  .port { position: absolute; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--port-off); box-shadow: 2px 2px 5px var(--dark), -1px -1px 3px var(--lit); z-index: 2; }
  .port.in { left: -8px; }
  .port.out { right: -8px; background: var(--grad); }

  /* ------------------------------------------------------------------------------- shape nodes */
  .shape { position: absolute; cursor: grab; }
  /* --out drawn round an outline: the lit tone up and to the left, the dark tone down and to the right */
  .shape svg { position: absolute; inset: 0; overflow: visible; filter: drop-shadow(-5px -5px 7px rgba(42, 47, 55, 0.9)) drop-shadow(6px 6px 8px rgba(12, 15, 19, 0.95)); }
  .shape .outline { fill: none; stroke: none; stroke-width: 1.5; }
  .shape.chosen .outline { stroke: var(--accent); }
  .port { cursor: crosshair; }
  .port:hover, .port.target { transform: scale(1.3); }
  .shape .port { width: 12px; height: 12px; margin: 0; opacity: 0; transition: opacity 120ms, transform 120ms; }
  .shape:hover .port, .shape.chosen .port, .world.linking .shape .port, .shape .port.joined { opacity: 1; }
  .shape .port.joined, .shape .port:hover, .port.target { background: var(--grad); }
  .wires path.pending { stroke-dasharray: 5 5; stroke: var(--sky); }
  .shape .label {
    position: absolute; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 6px; font-size: 14px; line-height: 1.35; color: var(--text); outline: none; overflow-wrap: anywhere; pointer-events: none;
  }
  .shape .label:empty::before { content: attr(data-hint); color: var(--text-faint); }
  .shape.editing { cursor: text; }
  .shape.editing .label { pointer-events: auto; user-select: text; cursor: text; }
  .shape.editing .label:empty::before { content: ""; }
  .grip { position: absolute; width: 9px; height: 9px; border-radius: 3px; background: var(--text); box-shadow: 0 0 0 1.5px var(--accent), 2px 2px 4px var(--dark); display: none; z-index: 3; }
  .shape.chosen:not(.editing) .grip { display: block; }

  /* ------------------------------------------------------------------------ the Add a node dialog */
  .scrim { position: fixed; inset: 0; z-index: 90; background: rgba(12, 15, 19, 0.5); display: none; }
  .add {
    position: fixed; z-index: 95; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 560px; max-height: calc(100vh - 80px);
    display: none; flex-direction: column; padding: 26px 22px 18px; border-radius: 30px; background: var(--ground); box-shadow: var(--lifted);
  }
  .add.open, .scrim.open { display: flex; }
  .add header { display: flex; align-items: center; padding: 0 8px 0 14px; }
  .add h2 { margin: 0; flex: 1; font-size: 20px; font-weight: 700; color: var(--text-strong); }
  .add header .chip { width: 38px; height: 38px; font-size: 16px; }
  .add .search { display: flex; align-items: center; gap: 10px; height: 46px; margin: 18px 0 12px; padding: 0 18px; border-radius: 999px; background: var(--well); box-shadow: var(--in); }
  .add .search input { flex: 1; border: 0; outline: none; background: transparent; color: var(--text); font: 14px var(--mono); }
  .add .search input::placeholder { color: var(--text-faint); }
  .add .list { overflow-y: auto; padding: 10px; margin: 0 -10px; }
  .kind { display: flex; align-items: center; gap: 16px; padding: 10px 14px; border-radius: 18px; cursor: pointer; position: relative; }
  .kind:hover, .kind.lit { background: var(--chip); box-shadow: var(--out-sm), var(--chip-edge); }
  .disc { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--sky); background: var(--card); box-shadow: var(--out-sm); }
  .disc svg { width: 20px; height: 20px; }
  .kind .words { flex: 1; min-width: 0; }
  .kind .title { font: 600 15px var(--mono); color: var(--text-strong); display: flex; align-items: center; gap: 8px; }
  .kind .summary { font: 13px/1.45 var(--mono); color: var(--text-dim); margin-top: 2px; }
  .kind .more { color: var(--text-dim); font-size: 18px; padding-right: 4px; }
  .kind.lit .more { color: var(--sky); }

  /* the flyout to the right of the Shape row */
  .flyout { position: fixed; z-index: 96; width: 230px; padding: 8px; border-radius: 18px; display: none; background: var(--card); box-shadow: var(--lifted); }
  .flyout.open { display: block; }
  .flyout .heading { padding: 6px 10px; font-size: 10.5px; letter-spacing: 0.12em; color: var(--text-faint); }
  .flyout .shape-row { display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 10px; border-radius: 12px; cursor: pointer; color: var(--text-control); }
  .flyout .shape-row:hover, .flyout .shape-row.lit { background: var(--well); box-shadow: var(--in-sm); color: var(--text-strong); }
  .flyout .shape-row svg { flex: none; color: var(--sky); }
  .flyout .sep { height: 2px; margin: 5px 8px; box-shadow: 0 -1px 0 var(--dark) inset, 0 1px 0 var(--lit); }


  /* design only: the state switcher */
  .states {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 120; display: flex; align-items: center; gap: 4px;
    padding: 4px 4px 4px 14px; border-radius: 999px; background: var(--well); box-shadow: var(--in-sm), 0 0 0 1px rgba(92, 182, 255, 0.25);
  }
  .states-label { font-size: 10px; letter-spacing: 0.14em; color: var(--sky); margin-right: 6px; }
  .states button { height: 28px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--text-dim); font: 12px var(--font); cursor: pointer; }
  .states button:hover { color: var(--text); }
  .states button.on { color: var(--text-strong); background: var(--chip); box-shadow: var(--out-sm), var(--chip-edge); }

  /* --------------------------------------------------------------------- the node's menu (menu_frame) */
  .menu, .submenu {
    position: fixed; z-index: 100; min-width: 240px; padding: 6px 0; border-radius: 10px; display: none;
    background: #262b33; border: 1px solid #3a404b; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    font: 15px var(--mono); color: var(--text-strong);
  }
  .submenu { z-index: 101; min-width: 210px; }
  .menu .row, .submenu .row { height: 40px; display: flex; align-items: center; padding: 0 22px 0 44px; cursor: default; }
  .menu .row:hover, .menu .row.open, .submenu .row:hover { background: #2f3540; }
  .menu .row .more { margin-left: auto; color: var(--text-dim); font-size: 17px; }
  .menu .row, .submenu .row { position: relative; }
  .submenu .row.checked::before { content: ""; position: absolute; left: 19px; top: 13px; width: 5px; height: 10px; border: solid var(--sky); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .submenu .sep { height: 1px; margin: 6px 16px; background: #14171c; }
  .menu .sep { height: 1px; margin: 6px 16px; background: #14171c; }

  /* ------------------------------------------------------------------------------- colour picker */
  .picker { position: fixed; z-index: 110; width: 300px; padding: 16px; border-radius: 22px; display: none; background: var(--ground); box-shadow: var(--lifted); }
  .picker header { display: flex; align-items: center; margin-bottom: 12px; cursor: move; }
  .picker header h2 { margin: 0; font-size: 13px; font-weight: 600; flex: 1; color: var(--text-strong); }
  .picker header .chip { width: 26px; height: 26px; }
  .well { border-radius: 12px; padding: 4px; background: var(--well); box-shadow: var(--in-sm); }
  .sv { position: relative; height: 150px; border-radius: 9px; cursor: crosshair; overflow: hidden; }
  .sv .white { position: absolute; inset: 0; background: linear-gradient(90deg, #fff, rgba(255, 255, 255, 0)); }
  .sv .black { position: absolute; inset: 0; background: linear-gradient(0deg, #000, rgba(0, 0, 0, 0)); }
  .knob { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(0, 0, 0, 0.5), 2px 2px 4px var(--dark); pointer-events: none; }
  .strip { position: relative; height: 14px; border-radius: 999px; cursor: pointer; margin-top: 10px; }
  .strip .knob { top: 50%; margin-top: -7px; background: transparent; }
  .hue { background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .checker {
    background-image: linear-gradient(45deg, #3a404a 25%, transparent 25%), linear-gradient(-45deg, #3a404a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #3a404a 75%), linear-gradient(-45deg, transparent 75%, #3a404a 75%);
    background-size: 10px 10px; background-position: 0 0, 0 5px, 5px -5px, -5px 0; background-color: #6c7483;
  }
  .alpha .fill { position: absolute; inset: 0; border-radius: 999px; }
  .strip-label { display: flex; justify-content: space-between; color: var(--text-faint); font-size: 10.5px; letter-spacing: 0.1em; margin-top: 12px; }
  .fields { display: grid; grid-template-columns: 1.8fr 1fr 1fr 1fr 1fr; gap: 6px; margin-top: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 10px; color: var(--text-faint); text-align: center; letter-spacing: 0.08em; }
  .field input { width: 100%; height: 28px; border: 0; border-radius: 9px; text-align: center; color: var(--text); font: 12px var(--mono); background: var(--well); outline: none; box-shadow: var(--in-sm); }
  .field input:focus { box-shadow: var(--in-sm), 0 0 0 1px var(--accent); }
  .swatches { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
  .swatches button { width: 24px; height: 24px; border-radius: 8px; border: 0; cursor: pointer; position: relative; box-shadow: var(--out-sm), inset 0 0 0 1px rgba(255, 255, 255, 0.1); }
  .swatches button.theme { background: var(--card); color: var(--text-dim); font-size: 10px; }
  .compare { display: flex; height: 28px; border-radius: 9px; overflow: hidden; margin-top: 14px; box-shadow: var(--in-sm); }
  .compare div { flex: 1; display: grid; place-items: center; font-size: 10.5px; color: rgba(255, 255, 255, 0.85); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .btn { height: 32px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer; font: 600 12.5px var(--font); color: var(--text-control); background: var(--chip); box-shadow: var(--out-sm), var(--chip-edge); }
  .btn:active { box-shadow: var(--in-sm); }
  .btn.ghost { background: transparent; box-shadow: none; color: var(--text-dim); margin-right: auto; padding: 0 6px; }
  .btn.ghost:hover { color: var(--text); }
  .btn.primary { color: #fff; background: var(--grad); box-shadow: var(--grad-out); }
</style>
</head>
<body>

<!-- the realm bar, as task-2250 draws it -->
<div class="realm-bar">
  <div class="track">
    <div class="pill on">view</div>
    <div class="pill">Planning board</div>
    <div class="pill">Agents</div>
  </div>
  <button class="chip" title="New Realm">+</button>
  <div class="spacer"></div>
  <div class="track" style="gap:6px;padding:3px 4px">
    <button class="chip" style="width:26px;height:26px" id="zoom-out" title="Zoom out">&minus;</button>
    <span class="zoom-read" id="zoom-read">100%</span>
    <button class="chip" style="width:26px;height:26px" id="zoom-in" title="Zoom in">+</button>
  </div>
</div>

<div class="canvas" id="canvas">
  <svg class="dunes" viewBox="0 0 1400 400" preserveAspectRatio="none">
    <path d="M0 170 C220 120 380 150 560 180 C760 215 900 110 1100 120 C1250 128 1340 160 1400 170 L1400 400 L0 400Z" fill="#1c2026"/>
    <path d="M0 260 C300 230 520 300 780 280 C1000 262 1200 300 1400 285 L1400 400 L0 400Z" fill="#1a1e24"/>
  </svg>
  <div class="world" id="world">
    <svg class="wires" id="wires" width="1" height="1"></svg>
  </div>


  <!-- Design only, not part of the feature: opens each state without a right click, which the Designer's web view keeps for itself. -->
  <div class="states" id="states">
    <span class="states-label">SHOW</span>
    <button data-state="menu">Shape menu</button>
    <button data-state="text">Menu + Text</button>
    <button data-state="picker" class="on">Menu + colour picker</button>
    <button data-state="add">Add node &rsaquo; Shapes</button>
    <button data-state="none">Board only</button>
  </div>
</div>

<!-- the Add a node dialog, with Shape as a new row whose flyout opens to the right -->
<div class="scrim" id="scrim"></div>
<div class="add" id="add">
  <header><h2>Add a node</h2><button class="chip" id="add-close" title="Close">&times;</button></header>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8d95a4" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/></svg>
    <input id="add-search" placeholder="Search nodes" spellcheck="false">
  </div>
  <div class="list" id="add-list"></div>
</div>
<div class="flyout" id="flyout"></div>

<!-- the node's right click menu: the rows realm_node_menu has today, plus Colour... -->
<div class="menu" id="menu">
  <div class="row" data-do="rename">Rename...</div>
  <div class="row" data-do="fill">Colour...</div>
  <div class="row" data-do="sub" data-sub="text-menu" id="text-row">Text<span class="more">&rsaquo;</span></div>
  <div class="sep"></div>
  <div class="row" data-do="sub" data-sub="arrange-menu" id="arrange-row">Arrange<span class="more">&rsaquo;</span></div>
  <div class="sep"></div>
  <div class="row" data-do="close">Close</div>
</div>
<div class="submenu" id="arrange-menu">
  <div class="row" data-do="front">Bring to Front</div>
  <div class="row" data-do="forward">Bring Forward</div>
  <div class="row" data-do="backward">Send Backward</div>
  <div class="row" data-do="back">Send to Back</div>
</div>
<div class="submenu" id="text-menu">
  <div class="row" data-do="align" data-value="left">Align Left</div>
  <div class="row" data-do="align" data-value="center">Align Centre</div>
  <div class="row" data-do="align" data-value="right">Align Right</div>
  <div class="sep"></div>
  <div class="row" data-do="valign" data-value="top">Align Top</div>
  <div class="row" data-do="valign" data-value="middle">Align Middle</div>
  <div class="row" data-do="valign" data-value="bottom">Align Bottom</div>
  <div class="sep"></div>
  <div class="row" data-do="size" data-value="12">12 pt</div>
  <div class="row" data-do="size" data-value="14">14 pt</div>
  <div class="row" data-do="size" data-value="18">18 pt</div>
  <div class="row" data-do="size" data-value="24">24 pt</div>
  <div class="row" data-do="size" data-value="32">32 pt</div>
  <div class="sep"></div>
  <div class="row" data-do="size" data-value="larger">Larger</div>
  <div class="row" data-do="size" data-value="smaller">Smaller</div>
</div>

<!-- the RGBA picker -->
<div class="picker" id="picker">
  <header id="picker-head"><h2 id="picker-title">Colour</h2><button class="chip" id="picker-close" title="Close">&times;</button></header>
  <div class="well"><div class="sv" id="sv"><div class="white"></div><div class="black"></div><div class="knob" id="sv-knob"></div></div></div>
  <div class="strip-label"><span>HUE</span></div>
  <div class="well" style="padding:3px;border-radius:999px;margin-top:4px"><div class="strip hue" id="hue" style="margin:0"><div class="knob" id="hue-knob"></div></div></div>
  <div class="strip-label"><span>ALPHA</span><span id="alpha-read">100%</span></div>
  <div class="well" style="padding:3px;border-radius:999px;margin-top:4px"><div class="strip alpha checker" id="alpha" style="margin:0"><div class="fill" id="alpha-fill"></div><div class="knob" id="alpha-knob"></div></div></div>
  <div class="fields">
    <div class="field"><input id="f-hex" spellcheck="false"><label>HEX RGBA</label></div>
    <div class="field"><input id="f-r"><label>R</label></div>
    <div class="field"><input id="f-g"><label>G</label></div>
    <div class="field"><input id="f-b"><label>B</label></div>
    <div class="field"><input id="f-a"><label>A %</label></div>
  </div>
  <div class="swatches" id="swatches"></div>
  <div class="compare checker"><div id="cmp-old">Before</div><div id="cmp-new">After</div></div>
  <div class="actions">
    <button class="btn" id="picker-cancel">Cancel</button>
    <button class="btn primary" id="picker-apply">Apply</button>
  </div>
</div>

<script>
(() => {
  const world = document.getElementById("world");
  const wires = document.getElementById("wires");
  const canvas = document.getElementById("canvas");
  const camera = { x: 0, y: 0, zoom: 1 };
  let chosen = null;
  let nextId = 1;
  const nodes = [];      // every node in drawing order
  const links = [];      // { a: { id, i }, b: { id, i } }: two nodes and an anchor on each

  // ------------------------------------------------------------------------------- shape outlines

  /** The outline of each kind of shape, as an SVG path at its real size, so corners never stretch. */
  const SHAPES = {
    rectangle: { label: "Rectangle", path: (w, h) => roundRect(0, 0, w, h, 6) },
    rounded:   { label: "Rounded rectangle", path: (w, h) => roundRect(0, 0, w, h, Math.min(w, h) * 0.22) },
    ellipse:   { label: "Circle", path: (w, h) => `M${w / 2} 0 A${w / 2} ${h / 2} 0 1 1 ${w / 2 - 0.01} 0Z` },
    triangle:  { label: "Triangle", path: (w, h) => `M${w / 2} 0 L${w} ${h} L0 ${h}Z`, text: (w, h) => [w * 0.22, h * 0.42, w * 0.56, h * 0.5] },
    diamond:   { label: "Diamond", path: (w, h) => `M${w / 2} 0 L${w} ${h / 2} L${w / 2} ${h} L0 ${h / 2}Z`, text: (w, h) => [w * 0.22, h * 0.22, w * 0.56, h * 0.56] },
    hexagon:   { label: "Hexagon", path: (w, h) => `M${w * 0.22} 0 L${w * 0.78} 0 L${w} ${h / 2} L${w * 0.78} ${h} L${w * 0.22} ${h} L0 ${h / 2}Z`, text: (w, h) => [w * 0.18, 0, w * 0.64, h] },
    parallelogram: { label: "Parallelogram", path: (w, h) => `M${w * 0.2} 0 L${w} 0 L${w * 0.8} ${h} L0 ${h}Z`, text: (w, h) => [w * 0.18, 0, w * 0.64, h] },
    star:      { label: "Star", path: (w, h) => star(w, h), text: (w, h) => [w * 0.3, h * 0.36, w * 0.4, h * 0.36] },
    note:      { label: "Sticky note", path: (w, h) => `M0 0 L${w} 0 L${w} ${h - 22} L${w - 22} ${h} L0 ${h}Z`, text: (w, h) => [10, 10, w - 20, h - 28] },
  };

  /** A rectangle with round corners as a path. */
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    return `M${x + r} ${y} H${x + w - r} A${r} ${r} 0 0 1 ${x + w} ${y + r} V${y + h - r} A${r} ${r} 0 0 1 ${x + w - r} ${y + h} H${x + r} A${r} ${r} 0 0 1 ${x} ${y + h - r} V${y + r} A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  }

  /** A five pointed star stretched to the box. */
  function star(w, h) {
    let d = "";
    for (let i = 0; i < 10; i++) {
      const angle = -Math.PI / 2 + (i * Math.PI) / 5;
      const r = i % 2 ? 0.42 : 1;
      d += `${i ? "L" : "M"}${w / 2 + Math.cos(angle) * (w / 2) * r} ${h * 0.53 + Math.sin(angle) * (h * 0.53) * r} `;
    }
    return d + "Z";
  }

  // ---------------------------------------------------------------------------------- colours

  /** A colour is an RGBA object, or null for the theme's own node surface. */
  const rgba = (c) => `rgba(${c.r}, ${c.g}, ${c.b}, ${(c.a / 255).toFixed(3)})`;
  const hex2 = (n) => n.toString(16).padStart(2, "0");
  const toHex = (c) => `#${hex2(c.r)}${hex2(c.g)}${hex2(c.b)}${hex2(c.a)}`;

  /** Reads #rgb, #rgba, #rrggbb or #rrggbbaa. */
  function fromHex(text) {
    let s = text.trim().replace(/^#/, "");
    if (s.length === 3 || s.length === 4) s = [...s].map((ch) => ch + ch).join("");
    if (s.length === 6) s += "ff";
    if (!/^[0-9a-f]{8}$/i.test(s)) return null;
    const n = (i) => parseInt(s.slice(i, i + 2), 16);
    return { r: n(0), g: n(2), b: n(4), a: n(6) };
  }

  /** Text that reads on a fill: the theme's own ink unless the fill is light and mostly opaque. */
  function inkFor(fill) {
    if (!fill) return "var(--text)";
    const light = (0.299 * fill.r + 0.587 * fill.g + 0.114 * fill.b) / 255;
    return light > 0.62 && fill.a > 150 ? "#1b1e24" : "var(--text)";
  }

  // ----------------------------------------------------------------------------------- nodes

  /** Adds one of the realm's existing nodes (a file editor or a terminal), as the screenshot has them. */
  function addPanelNode({ x, y, w, h, icon, name, tools, body, caption }) {
    const el = document.createElement("div");
    el.className = "node";
    el.innerHTML = `<span class="caption">${caption}</span><div class="head"><span class="mark">${icon}</span><span class="name">${name}</span><span class="tools">${tools}</span></div><div class="body">${body}</div><span class="port in" data-i="0"></span><span class="port out" data-i="1"></span>`;
    const node = { id: nextId++, kind: "panel", name, el, x, y, w, h };
    el.dataset.id = node.id;
    world.appendChild(el);
    nodes.push(node);
    place(node);
    el.addEventListener("pointerdown", (e) => {
      const port = e.target.closest(".port");
      if (port) { e.stopPropagation(); startLink(e, node, +port.dataset.i); return; }
      choose(node);
      if (e.target.closest(".head")) startMove(e, node);
    });
    return node;
  }

  /** Adds a shape node of one kind at a place on the canvas. */
  function addShape(kind, x, y, w = 160, h = 110, text = "", fill = null, stroke = null) {
    const el = document.createElement("div");
    el.className = "shape";
    el.innerHTML = `<svg><path class="fill"></path><path class="sheen"></path><path class="outline"></path></svg><div class="label" data-hint="${SHAPES[kind].label}"></div>`;
    for (const at of ["nw", "n", "ne", "e", "se", "s", "sw", "w"]) {
      const grip = document.createElement("span");
      grip.className = "grip";
      grip.dataset.at = at;
      el.appendChild(grip);
    }
    const node = { id: nextId++, kind, name: `${SHAPES[kind].label} ${nextId - 1}`, el, x, y, w, h, fill, stroke, align: "center", valign: "middle", size: 14 };
    el.dataset.id = node.id;
    el.querySelector(".label").textContent = text;
    world.appendChild(el);
    nodes.push(node);
    place(node);
    wireShape(node);
    return node;
  }

  /** Puts a node where its model says, and redraws a shape's outline at its size. */
  function place(node) {
    const { el, x, y, w, h } = node;
    Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
    if (node.kind !== "panel") paintShape(node);
    drawWires();
  }

  /** Draws a shape: the theme's card gradient or the chosen RGBA, a lit top edge, and an outline. */
  function paintShape(node) {
    const { el, w, h, kind } = node;
    const svg = el.querySelector("svg");
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    const d = SHAPES[kind].path(w, h);
    const id = `g${node.id}`;
    let defs = svg.querySelector("defs");
    if (!defs) { defs = document.createElementNS("http://www.w3.org/2000/svg", "defs"); svg.prepend(defs); }
    defs.innerHTML = `
      <linearGradient id="${id}-theme" x1="0.21" y1="0" x2="0.79" y2="1"><stop offset="0" stop-color="#252a32"/><stop offset="1" stop-color="#1c2026"/></linearGradient>
      <linearGradient id="${id}-sheen" x1="0.21" y1="0" x2="0.79" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.08"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#0c0f13" stop-opacity="0.22"/></linearGradient>`;
    const fill = el.querySelector(".fill");
    fill.setAttribute("d", d);
    fill.setAttribute("fill", node.fill ? rgba(node.fill) : `url(#${id}-theme)`);
    const sheen = el.querySelector(".sheen");
    sheen.setAttribute("d", d);
    sheen.setAttribute("fill", node.fill ? `url(#${id}-sheen)` : "none");
    const outline = el.querySelector(".outline");
    outline.setAttribute("d", d);
    outline.style.stroke = node.stroke && node !== chosen ? rgba(node.stroke) : "";
    if (node.stroke && node !== chosen) outline.style.strokeWidth = "2";
    else outline.style.strokeWidth = "";

    const [tx, ty, tw, th] = (SHAPES[kind].text || ((w, h) => [8, 8, w - 16, h - 16]))(w, h);
    const label = el.querySelector(".label");
    const across = { left: "flex-start", center: "center", right: "flex-end" }, down = { top: "flex-start", middle: "center", bottom: "flex-end" };
    Object.assign(label.style, {
      left: `${tx}px`, top: `${ty}px`, width: `${tw}px`, height: `${th}px`, color: inkFor(node.fill),
      justifyContent: across[node.align], alignItems: down[node.valign], textAlign: node.align, fontSize: `${node.size}px`,
    });

    const points = anchors(node);
    let ports = el.querySelectorAll(".port");
    if (ports.length !== points.length) {
      ports.forEach((p) => p.remove());
      points.forEach((_, i) => { const p = document.createElement("span"); p.className = "port"; p.dataset.i = i; el.appendChild(p); });
      ports = el.querySelectorAll(".port");
    }
    ports.forEach((p, i) => { p.style.left = `${points[i].x - 6}px`; p.style.top = `${points[i].y - 6}px`; });

    const grips = el.querySelectorAll(".grip");
    const spots = { nw: [0, 0], n: [w / 2, 0], ne: [w, 0], e: [w, h / 2], se: [w, h], s: [w / 2, h], sw: [0, h], w: [0, h / 2] };
    grips.forEach((g) => { const [gx, gy] = spots[g.dataset.at]; g.style.left = `${gx - 4.5}px`; g.style.top = `${gy - 4.5}px`; g.style.cursor = `${g.dataset.at}-resize`; });
  }

  /** The pointer behaviour of a shape: choose and drag, resize from a grip, type on a double click, menu on a right click. */
  function wireShape(node) {
    const el = node.el;
    el.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      if (el.classList.contains("editing")) return;
      const port = e.target.closest(".port");
      if (port) { e.stopPropagation(); startLink(e, node, +port.dataset.i); return; }
      choose(node);
      const grip = e.target.closest(".grip");
      if (grip) startResize(e, node, grip.dataset.at);
      else startMove(e, node);
    });
    el.addEventListener("dblclick", (e) => { e.stopPropagation(); startEditing(node); });
    el.addEventListener("contextmenu", (e) => { e.preventDefault(); e.stopPropagation(); choose(node); openMenu(node, e.clientX, e.clientY); });
  }

  /** Makes a node the chosen one, the way a click anywhere in a node does in the realm. */
  function choose(node) {
    if (chosen && chosen !== node) stopEditing(chosen);
    const before = chosen;
    chosen = node;
    nodes.forEach((n) => n.el.classList.toggle("chosen", n === node));
    if (before && before.kind !== "panel") paintShape(before);
    if (node && node.kind !== "panel") paintShape(node);
  }

  /** Follows the pointer to move a node, in canvas points. */
  function startMove(e, node) {
    const sx = e.clientX, sy = e.clientY, ox = node.x, oy = node.y;
    const move = (m) => { node.x = ox + (m.clientX - sx) / camera.zoom; node.y = oy + (m.clientY - sy) / camera.zoom; place(node); };
    follow(move);
  }

  /** Follows the pointer to resize a shape from one of its eight grips, keeping the far edge still. */
  function startResize(e, node, at) {
    e.stopPropagation();
    const sx = e.clientX, sy = e.clientY, o = { x: node.x, y: node.y, w: node.w, h: node.h };
    const move = (m) => {
      const dx = (m.clientX - sx) / camera.zoom, dy = (m.clientY - sy) / camera.zoom;
      let { x, y, w, h } = o;
      if (at.includes("e")) w = o.w + dx;
      if (at.includes("s")) h = o.h + dy;
      if (at.includes("w")) { w = o.w - dx; x = o.x + dx; }
      if (at.includes("n")) { h = o.h - dy; y = o.y + dy; }
      if (m.shiftKey) { const side = Math.max(w, h); if (at.includes("w")) x -= side - w; if (at.includes("n")) y -= side - h; w = h = side; }
      if (w < 48) { if (at.includes("w")) x -= 48 - w; w = 48; }
      if (h < 40) { if (at.includes("n")) y -= 40 - h; h = 40; }
      Object.assign(node, { x, y, w, h });
      place(node);
    };
    follow(move);
  }

  /** Calls a function on every pointer move until the button comes up. */
  function follow(move) {
    const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
    addEventListener("pointermove", move);
    addEventListener("pointerup", up);
  }

  /** Turns a shape's label into a text box with the caret at the end. */
  function startEditing(node) {
    if (node.kind === "panel") return;
    closeMenu();
    choose(node);
    const label = node.el.querySelector(".label");
    node.el.classList.add("editing");
    label.contentEditable = "true";
    label.focus();
    const range = document.createRange();
    range.selectNodeContents(label);
    range.collapse(false);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  /** Ends typing in a shape. */
  function stopEditing(node) {
    if (!node || !node.el.classList.contains("editing")) return;
    const label = node.el.querySelector(".label");
    label.contentEditable = "false";
    if (!label.textContent.trim()) label.textContent = "";
    node.el.classList.remove("editing");
    getSelection().removeAllRanges();
  }

  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input")) return;
    const editing = chosen && chosen.el.classList.contains("editing");
    if (e.key === "Escape") { if (editing) stopEditing(chosen); closeMenu(); closePicker(false); }
    else if (editing && e.key === "Enter" && (e.ctrlKey || e.metaKey)) stopEditing(chosen);
    else if (!editing && chosen && chosen.kind !== "panel" && (e.key === "Enter" || e.key === "F2")) { e.preventDefault(); startEditing(chosen); }
    else if (!editing && chosen && (e.key === "Delete" || e.key === "Backspace") && !e.target.closest("input")) closeNode(chosen);
  });

  // ------------------------------------------------------------------------------------- wires

  /**
   * Where a node can be wired, in its own points, each with the way out of the outline there.
   * A shape: the middle of its top, right, bottom and left sides, which is where its outline crosses its own
   * centre lines. A star: its five tips. One of the realm's existing nodes: the middle of its left and right sides.
   */
  function anchors(n) {
    const { w, h, kind } = n;
    const sides = (top, right, bottom, left) => [
      { x: top, y: 0, nx: 0, ny: -1 }, { x: w - right, y: h / 2, nx: 1, ny: 0 },
      { x: bottom, y: h, nx: 0, ny: 1 }, { x: left, y: h / 2, nx: -1, ny: 0 },
    ];
    if (kind === "panel") return [{ x: 0, y: h / 2, nx: -1, ny: 0 }, { x: w, y: h / 2, nx: 1, ny: 0 }];
    if (kind === "star") {
      return [0, 1, 2, 3, 4].map((i) => {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
        return { x: w / 2 + Math.cos(a) * (w / 2), y: h * 0.53 + Math.sin(a) * h * 0.53, nx: Math.cos(a), ny: Math.sin(a) };
      });
    }
    if (kind === "triangle") return sides(w / 2, w / 4, w / 2, w / 4);
    if (kind === "parallelogram") return sides(w / 2, w * 0.1, w / 2, w * 0.1);
    return sides(w / 2, 0, w / 2, 0);
  }

  /** A node's anchor in canvas points. */
  function anchorAt(n, i) {
    const a = anchors(n)[i] || anchors(n)[0];
    return { x: n.x + a.x, y: n.y + a.y, nx: a.nx, ny: a.ny };
  }

  let pending = ""; // the wire being dragged, as SVG

  /** Draws every connection between two anchors, leaving each one along the outline's way out. */
  function drawWires() {
    const by = Object.fromEntries(nodes.map((n) => [n.id, n]));
    document.querySelectorAll(".port.joined").forEach((p) => p.classList.remove("joined"));
    wires.innerHTML = links.map(({ a, b }) => {
      const from = by[a.id], to = by[b.id];
      if (!from || !to) return "";
      from.el.querySelector(`.port[data-i="${a.i}"]`)?.classList.add("joined");
      to.el.querySelector(`.port[data-i="${b.i}"]`)?.classList.add("joined");
      return `<path d="${curve(anchorAt(from, a.i), anchorAt(to, b.i))}"/>`;
    }).join("") + pending;
  }

  /** A curve from one anchor to another, or to the pointer when the second has no direction. */
  function curve(p, q) {
    const bend = Math.max(40, Math.hypot(q.x - p.x, q.y - p.y) / 3);
    const qn = q.nx === undefined ? { nx: 0, ny: 0 } : q;
    return `M${p.x} ${p.y} C${p.x + p.nx * bend} ${p.y + p.ny * bend} ${q.x + qn.nx * bend} ${q.y + qn.ny * bend} ${q.x} ${q.y}`;
  }

  /** The node and anchor under a screen point: a port, or the nearest anchor of the node the point is over. */
  function anchorUnder(cx, cy, except) {
    const el = document.elementFromPoint(cx, cy);
    const host = el && el.closest(".shape, .node");
    const node = host && nodes.find((n) => n.id === +host.dataset.id);
    if (!node || node === except) return null;
    const port = el.closest(".port");
    if (port) return { node, i: +port.dataset.i };
    const pt = toWorld(cx, cy);
    let best = 0, near = Infinity;
    anchors(node).forEach((a, i) => { const d = Math.hypot(node.x + a.x - pt.x, node.y + a.y - pt.y); if (d < near) { near = d; best = i; } });
    return { node, i: best };
  }

  /** Drags a wire out of an anchor and joins it to the anchor it is let go on. */
  function startLink(e, node, i) {
    const from = anchorAt(node, i);
    world.classList.add("linking");
    let target = null;
    const move = (m) => {
      document.querySelectorAll(".port.target").forEach((p) => p.classList.remove("target"));
      target = anchorUnder(m.clientX, m.clientY, node);
      const end = target ? anchorAt(target.node, target.i) : toWorld(m.clientX, m.clientY);
      if (target) target.node.el.querySelector(`.port[data-i="${target.i}"]`)?.classList.add("target");
      pending = `<path class="pending" d="${curve(from, end)}"/>`;
      drawWires();
    };
    const up = () => {
      removeEventListener("pointermove", move);
      removeEventListener("pointerup", up);
      world.classList.remove("linking");
      document.querySelectorAll(".port.target").forEach((p) => p.classList.remove("target"));
      pending = "";
      if (target) links.push({ a: { id: node.id, i }, b: { id: target.node.id, i: target.i } });
      drawWires();
    };
    addEventListener("pointermove", move);
    addEventListener("pointerup", up);
  }

  // ------------------------------------------------------------------------------------- menu

  const menu = document.getElementById("menu");

  /** Opens the node's right click menu at the pointer, kept inside the window. */
  function openMenu(node, x, y) {
    closePicker(false);
    closeSubs();
    menu.style.display = "block";
    const r = menu.getBoundingClientRect();
    menu.style.left = `${Math.min(x, innerWidth - r.width - 8)}px`;
    menu.style.top = `${Math.min(y, innerHeight - r.height - 8)}px`;
    menu.dataset.x = x;
    menu.dataset.y = y;
  }

  const subRows = [...menu.querySelectorAll('.row[data-do="sub"]')];

  /** Opens a row's submenu to the right of the menu, level with the row, or to the left when there is no room. */
  function openSub(row) {
    closeSubs();
    const sub = byId(row.dataset.sub);
    row.classList.add("open");
    if (sub.id === "text-menu") tickText(sub, chosen);
    sub.style.display = "block";
    const r = row.getBoundingClientRect(), box = menu.getBoundingClientRect(), size = sub.getBoundingClientRect();
    const right = box.right - 2;
    sub.style.left = `${right + size.width > innerWidth - 8 ? box.left - size.width + 2 : right}px`;
    sub.style.top = `${Math.max(8, Math.min(r.top - 7, innerHeight - size.height - 8))}px`;
  }

  /** Ticks the Text submenu's rows that are the chosen shape's alignment and size. */
  function tickText(sub, node) {
    sub.querySelectorAll(".row").forEach((row) => {
      const { do: what, value } = row.dataset;
      const on = (what === "align" && node.align === value) || (what === "valign" && node.valign === value) || (what === "size" && String(node.size) === value);
      row.classList.toggle("checked", on);
    });
  }

  /** Closes every submenu. */
  function closeSubs() {
    subRows.forEach((row) => { row.classList.remove("open"); byId(row.dataset.sub).style.display = "none"; });
  }

  /** Puts the menu and its submenus away. */
  function closeMenu() { menu.style.display = "none"; closeSubs(); }

  menu.querySelectorAll(".row").forEach((row) => row.addEventListener("pointerenter", () => (row.dataset.do === "sub" ? openSub(row) : closeSubs())));

  const SIZES_PT = [12, 14, 18, 24, 32];

  /** Carries out a row of the menu or of a submenu on the chosen node. */
  function actOnRow(e) {
    const row = e.target.closest(".row");
    if (!row || !chosen) return;
    const node = chosen, act = row.dataset.do, value = row.dataset.value;
    if (act === "sub") { openSub(row); return; }
    const at = menu.getBoundingClientRect();
    closeMenu();
    if (act === "rename") { const name = prompt("Name of the node", node.name); if (name) node.name = name; }
    else if (act === "fill") openPicker(node, "fill", at.right - 4, at.top + 40);
    else if (act === "close") closeNode(node);
    else if (act === "align" || act === "valign") { node[act] = value; paintShape(node); }
    else if (act === "size") { node.size = stepSize(node.size, value); paintShape(node); }
    else arrange(node, act);
  }

  /** A font size from a row: a number, or one step up or down the list of sizes. */
  function stepSize(now, value) {
    if (value === "larger") return SIZES_PT.find((n) => n > now) ?? now;
    if (value === "smaller") return [...SIZES_PT].reverse().find((n) => n < now) ?? now;
    return +value;
  }

  menu.addEventListener("click", actOnRow);
  document.querySelectorAll(".submenu").forEach((sub) => sub.addEventListener("click", actOnRow));

  /** Moves a node in the drawing order, which is the realm's Arrange submenu. */
  function arrange(node, how) {
    const i = nodes.indexOf(node);
    nodes.splice(i, 1);
    const at = { front: nodes.length, back: 0, forward: Math.min(i + 1, nodes.length), backward: Math.max(i - 1, 0) }[how];
    nodes.splice(at, 0, node);
    nodes.forEach((n) => world.appendChild(n.el));
  }

  /** Takes a node and its connections off the canvas. */
  function closeNode(node) {
    nodes.splice(nodes.indexOf(node), 1);
    node.el.remove();
    for (let i = links.length - 1; i >= 0; i--) if (links[i].a.id === node.id || links[i].b.id === node.id) links.splice(i, 1);
    chosen = null;
    drawWires();
  }

  // ------------------------------------------------------------------------------- the picker

  const picker = document.getElementById("picker");
  const sv = document.getElementById("sv"), hue = document.getElementById("hue"), alpha = document.getElementById("alpha");
  const f = { hex: byId("f-hex"), r: byId("f-r"), g: byId("f-g"), b: byId("f-b"), a: byId("f-a") };
  const state = { node: null, which: "fill", before: null, h: 0, s: 0, v: 0, a: 255 };
  function byId(id) { return document.getElementById(id); }

  /** The theme's swatches: Unluminous Dark's accent, git's greens and reds, and the four highlight colours. */
  const SWATCHES = ["#3d78ff", "#489ff8", "#5cb6ff", "#3ad6ad", "#2fb98f", "#ffc062", "#ff8f73", "#b07cf0", "#ffd86b66", "#7ce0a066", "#7cc4ff66", "#ff8ab066", "#e8ebf1", "#353b46"];
  const swatchRow = byId("swatches");
  const themeButton = document.createElement("button");
  themeButton.className = "theme";
  themeButton.title = "Theme colour";
  themeButton.textContent = "T";
  themeButton.onclick = () => setFromColour(null);
  swatchRow.appendChild(themeButton);
  for (const s of SWATCHES) {
    const b = document.createElement("button");
    b.style.background = s;
    b.title = s;
    b.onclick = () => setFromColour(fromHex(s));
    swatchRow.appendChild(b);
  }

  /** Opens the picker for a shape's fill or outline, beside where the menu was. */
  function openPicker(node, which, x, y) {
    state.node = node;
    state.which = which;
    state.before = node[which] ? { ...node[which] } : null;
        byId("cmp-old").style.background = state.before ? rgba(state.before) : "linear-gradient(145deg,#252a32,#1c2026)";
    setFromColour(state.before || (which === "fill" ? { r: 42, g: 47, b: 56, a: 255 } : { r: 255, g: 255, b: 255, a: 20 }), true);
    picker.style.display = "block";
    const r = picker.getBoundingClientRect();
    picker.style.left = `${Math.max(8, Math.min(x + 12, innerWidth - r.width - 8))}px`;
    picker.style.top = `${Math.max(58, Math.min(y - 40, innerHeight - r.height - 8))}px`;
  }

  /** Closes the picker, putting the old colour back unless it was applied. */
  function closePicker(apply) {
    if (picker.style.display !== "block") return;
    if (!apply && state.node) { state.node[state.which] = state.before; paintShape(state.node); }
    picker.style.display = "none";
    state.node = null;
  }

  /** Sets the picker from an RGBA colour (null is the theme), and previews it on the shape. */
  function setFromColour(c, quiet) {
    if (c === null) {
      if (state.node) { state.node[state.which] = null; paintShape(state.node); }
      byId("cmp-new").style.background = "linear-gradient(145deg,#252a32,#1c2026)";
      return;
    }
    const [h, s, v] = rgbToHsv(c.r, c.g, c.b);
    if (s > 0) state.h = h;
    Object.assign(state, { s, v, a: c.a });
    render(quiet);
  }

  /** Redraws the picker from its HSV and alpha, and writes the colour to the shape. */
  function render() {
    const [r, g, b] = hsvToRgb(state.h, state.s, state.v);
    const c = { r, g, b, a: state.a };
    sv.style.background = `hsl(${state.h}, 100%, 50%)`;
    Object.assign(byId("sv-knob").style, { left: `${state.s * 100}%`, top: `${(1 - state.v) * 100}%`, background: `rgb(${r},${g},${b})` });
    byId("hue-knob").style.left = `${(state.h / 360) * 100}%`;
    byId("alpha-knob").style.left = `${(state.a / 255) * 100}%`;
    byId("alpha-fill").style.background = `linear-gradient(90deg, rgba(${r},${g},${b},0), rgb(${r},${g},${b}))`;
    byId("alpha-read").textContent = `${Math.round((state.a / 255) * 100)}%`;
    if (document.activeElement !== f.hex) f.hex.value = toHex(c);
    for (const k of ["r", "g", "b"]) if (document.activeElement !== f[k]) f[k].value = c[k];
    if (document.activeElement !== f.a) f.a.value = Math.round((c.a / 255) * 100);
    byId("cmp-new").style.background = rgba(c);
    if (state.node) { state.node[state.which] = c; paintShape(state.node); }
  }

  /** Lets a strip or the square be dragged, reporting where the pointer is as fractions of it. */
  function drag(el, onMove) {
    el.addEventListener("pointerdown", (e) => {
      const at = (m) => { const r = el.getBoundingClientRect(); onMove(clamp((m.clientX - r.left) / r.width), clamp((m.clientY - r.top) / r.height)); render(); };
      at(e);
      follow(at);
    });
  }
  const clamp = (n) => Math.max(0, Math.min(1, n));
  drag(sv, (x, y) => { state.s = x; state.v = 1 - y; });
  drag(hue, (x) => { state.h = x * 360; });
  drag(alpha, (x) => { state.a = Math.round(x * 255); });

  f.hex.addEventListener("input", () => { const c = fromHex(f.hex.value); if (c) setFromColour(c); });
  for (const k of ["r", "g", "b", "a"]) {
    f[k].addEventListener("input", () => {
      const n = (key, max) => Math.max(0, Math.min(max, parseInt(f[key].value, 10) || 0));
      setFromColour({ r: n("r", 255), g: n("g", 255), b: n("b", 255), a: Math.round((n("a", 100) / 100) * 255) });
    });
  }
  byId("picker-apply").onclick = () => closePicker(true);
  byId("picker-cancel").onclick = () => closePicker(false);
  byId("picker-close").onclick = () => closePicker(false);
  byId("picker-head").addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    const sx = e.clientX - picker.offsetLeft, sy = e.clientY - picker.offsetTop;
    follow((m) => { picker.style.left = `${m.clientX - sx}px`; picker.style.top = `${m.clientY - sy}px`; });
  });

  /** HSV (0-360, 0-1, 0-1) from 0-255 RGB. */
  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [(h * 60 + 360) % 360, max ? d / max : 0, max];
  }

  /** 0-255 RGB from HSV. */
  function hsvToRgb(h, s, v) {
    const k = (n) => (n + h / 60) % 6;
    const ch = (n) => Math.round((v - v * s * Math.max(0, Math.min(k(n), 4 - k(n), 1))) * 255);
    return [ch(5), ch(3), ch(1)];
  }

  // ------------------------------------------------------------------------ the Add a node dialog

  /** The node kinds with the names and summaries Kind::label and Kind::summary give them, and Shape added at the end. */
  const LINE = 'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
  const KINDS = [
    { name: "Terminal", summary: "A real terminal running this machine's own shell, or a program you name.", icon: `<rect x="2" y="3" width="16" height="14" rx="3" ${LINE}/><path d="M6 8l2.5 2L6 12M10 13h4" ${LINE}/>` },
    { name: "Web Browser", summary: "A web page, with back, forward, reload and an address.", icon: `<rect x="2" y="3" width="16" height="14" rx="3" ${LINE}/><path d="M5 14l4-4 3 3 2-2 2 3" ${LINE}/><circle cx="13.5" cy="7" r="1.3" ${LINE}/>` },
    { name: "Folder View", summary: "A folder tree, with the explorer's own rows, icons and right click menu.", icon: `<path d="M2.5 6a2 2 0 0 1 2-2h3.5l2 2h5.5a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2z" ${LINE}/>` },
    { name: "File Editor", summary: "A file, with the editing area's gutter, folding, breakpoints and find.", icon: `<path d="M5 2.5h6l4 4v10a1.5 1.5 0 0 1-1.5 1.5h-8.5A1.5 1.5 0 0 1 3.5 16.5V4A1.5 1.5 0 0 1 5 2.5z" ${LINE}/><path d="M11 2.5V6.5h4" ${LINE}/>` },
    { name: "Agent Chat", summary: "An agent, with its own conversation, that can drive the nodes it is wired to.", icon: `<rect x="3" y="6" width="14" height="10" rx="3" ${LINE}/><path d="M10 6V3.5M8 11h.01M12 11h.01" ${LINE}/>` },
    { name: "Agent Tasks", summary: "The Agent-Tasks board: the lanes, the backlog, the epics and a ticket.", icon: `<rect x="4" y="3" width="12" height="15" rx="2" ${LINE}/><path d="M7.5 8h5M7.5 11h5M7.5 14h3" ${LINE}/>` },
    { name: "Image", summary: "A picture from this project, fitted to the node.", icon: `<rect x="2" y="4" width="16" height="13" rx="2.5" ${LINE}/><path d="M4.5 15l4-4.5 3 3 2-2 2.5 3.5" ${LINE}/>` },
    { name: "Audio", summary: "A sound from this project, with play, pause, a seek bar and a volume.", icon: `<path d="M3 8h3l4-3.5v11L6 12H3z" ${LINE}/><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15 5a7 7 0 0 1 0 10" ${LINE}/>` },
    { name: "Video", summary: "A video from this project, with play, pause, a seek bar and a volume.", icon: `<rect x="2" y="4" width="16" height="12" rx="2.5" ${LINE}/><path d="M8.5 7.5v5l4-2.5z" ${LINE}/>` },
    { name: "Note", summary: "A Markdown note, written in the editor and read as a preview.", icon: `<path d="M4 3h12v10l-4 4H4z" ${LINE}/><path d="M12 17v-4h4M7 7h6M7 10h4" ${LINE}/>` },
    { name: "Shape", isShape: true, summary: "A whiteboard shape with text in it: a rectangle, a circle, a diamond and more.", icon: `<rect x="2.5" y="9.5" width="8" height="8" rx="1.5" ${LINE}/><circle cx="14" cy="6" r="3.5" ${LINE}/><path d="M14 11.5l3.5 6h-7z" ${LINE}/>` },
  ];
  const SIZES = { ellipse: [130, 130], star: [130, 130], triangle: [140, 125], diamond: [140, 140], note: [160, 150] };

  const addBox = byId("add"), scrim = byId("scrim"), flyout = byId("flyout"), list = byId("add-list"), search = byId("add-search");
  let dropAt = null; // where on the canvas the new node goes; null is the middle of the view

  /** Opens the dialog. A double click on the empty canvas passes the point it was made at. */
  function openAdd(at = null) {
    dropAt = at;
    closeMenu();
    closePicker(false);
    search.value = "";
    drawKinds();
    addBox.classList.add("open");
    scrim.classList.add("open");
    search.focus();
  }

  /** Closes the dialog and its flyout. */
  function closeAdd() {
    addBox.classList.remove("open");
    scrim.classList.remove("open");
    closeFlyout();
  }

  /** The kinds that match the search. Shape matches on the shape names as well, so "diamond" finds it. */
  function matching() {
    const q = search.value.trim().toLowerCase();
    if (!q) return KINDS;
    return KINDS.filter((k) => `${k.name} ${k.summary}`.toLowerCase().includes(q) || (k.isShape && shapesMatching(q).length));
  }

  /** The shapes whose name holds the search, or all of them. */
  function shapesMatching(q) {
    const all = Object.entries(SHAPES);
    if (!q) return all;
    const hits = all.filter(([, s]) => s.label.toLowerCase().includes(q));
    return hits.length || !"shape".includes(q) ? hits : all;
  }

  /** Draws the rows. The Shape row has a chevron and opens its flyout instead of adding a node. */
  function drawKinds() {
    list.innerHTML = "";
    closeFlyout();
    for (const kind of matching()) {
      const row = document.createElement("div");
      row.className = "kind";
      row.innerHTML = `<span class="disc"><svg viewBox="0 0 20 20">${kind.icon}</svg></span><span class="words"><span class="title">${kind.name}</span><div class="summary">${kind.summary}</div></span>${kind.isShape ? '<span class="more">&rsaquo;</span>' : ""}`;
      if (kind.isShape) {
        row.addEventListener("pointerenter", () => openFlyout(row));
        row.addEventListener("click", () => openFlyout(row));
      } else {
        row.addEventListener("pointerenter", closeFlyout);
        row.addEventListener("click", closeAdd);
      }
      list.appendChild(row);
    }
    const q = search.value.trim().toLowerCase();
    const shapeRow = [...list.children].find((r) => r.querySelector(".more"));
    if (q && shapeRow && shapesMatching(q).length < Object.keys(SHAPES).length) openFlyout(shapeRow);
  }

  /** Opens the flyout to the right of the Shape row, its first shape level with the row, kept inside the window. */
  function openFlyout(row) {
    [...list.children].forEach((r) => r.classList.toggle("lit", r === row));
    const q = search.value.trim().toLowerCase();
    const shapes = shapesMatching(q);
    flyout.innerHTML = `<div class="heading">SHAPES</div>` + shapes.map(([kind, s], i) => {
      const box = kind === "rectangle" || kind === "rounded" || kind === "parallelogram" ? [18, 13] : [18, 18];
      const sep = !q && i === 7 ? '<div class="sep"></div>' : "";
      return `${sep}<div class="shape-row" data-kind="${kind}"><svg width="22" height="18" viewBox="-1 -1 ${box[0] + 2} ${box[1] + 2}"><path d="${s.path(...box)}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>${s.label}</div>`;
    }).join("");
    flyout.querySelectorAll(".shape-row").forEach((r) => r.addEventListener("click", () => addShapeFromDialog(r.dataset.kind)));
    flyout.classList.add("open");
    const rr = row.getBoundingClientRect(), dr = addBox.getBoundingClientRect(), fr = flyout.getBoundingClientRect();
    const right = dr.right + 10;
    const left = right + fr.width > innerWidth - 8 ? dr.left - fr.width - 10 : right;
    flyout.style.left = `${left}px`;
    flyout.style.top = `${Math.max(8, Math.min(rr.top - 6, innerHeight - fr.height - 8))}px`;
  }

  /** Closes the flyout and unlights the Shape row. */
  function closeFlyout() {
    flyout.classList.remove("open");
    [...list.children].forEach((r) => r.classList.remove("lit"));
  }

  /** Adds the chosen shape where the dialog was opened from, chooses it and starts typing in it. */
  function addShapeFromDialog(kind) {
    const size = SIZES[kind] || [170, 100];
    const r = canvas.getBoundingClientRect();
    const pt = dropAt || toWorld(r.left + r.width / 2, r.top + r.height / 2);
    closeAdd();
    const node = addShape(kind, pt.x - size[0] / 2, pt.y - size[1] / 2, ...size);
    choose(node);
    startEditing(node);
  }

  byId("add-close").onclick = closeAdd;
  scrim.addEventListener("pointerdown", closeAdd);
  search.addEventListener("input", drawKinds);
  search.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeAdd();
    if (e.key === "Enter") { const first = flyout.querySelector(".shape-row"); if (flyout.classList.contains("open") && first) addShapeFromDialog(first.dataset.kind); }
  });
  canvas.addEventListener("dblclick", (e) => {
    if (e.target.closest(".node, .shape")) return;
    openAdd(toWorld(e.clientX, e.clientY));
  });

  // ---------------------------------------------------------------------------------- camera

  /** A point on the screen in canvas points. */
  function toWorld(cx, cy) {
    const r = canvas.getBoundingClientRect();
    return { x: (cx - r.left - camera.x) / camera.zoom, y: (cy - r.top - camera.y) / camera.zoom };
  }

  /** Applies the camera to the world layer and the bar's reading. */
  function applyCamera() {
    world.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.zoom})`;
    byId("zoom-read").textContent = `${Math.round(camera.zoom * 100)}%`;
  }

  /** Zooms about a screen point, keeping what is under it still. */
  function zoomAbout(cx, cy, factor) {
    const before = toWorld(cx, cy);
    camera.zoom = Math.max(0.25, Math.min(3, camera.zoom * factor));
    const r = canvas.getBoundingClientRect();
    camera.x = cx - r.left - before.x * camera.zoom;
    camera.y = cy - r.top - before.y * camera.zoom;
    applyCamera();
  }

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAbout(e.clientX, e.clientY, e.deltaY < 0 ? 1.1 : 1 / 1.1);
    else { camera.x -= e.deltaX; camera.y -= e.deltaY; applyCamera(); }
  }, { passive: false });
  canvas.addEventListener("pointerdown", (e) => {
    if (e.target !== canvas && !e.target.closest(".dunes") && e.target !== world && e.target !== wires) return;
    closeMenu();
    if (chosen) { stopEditing(chosen); choose(null); }
    const sx = e.clientX - camera.x, sy = e.clientY - camera.y;
    canvas.classList.add("panning");
    follow((m) => { camera.x = m.clientX - sx; camera.y = m.clientY - sy; applyCamera(); });
    addEventListener("pointerup", () => canvas.classList.remove("panning"), { once: true });
  });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".menu, .submenu")) closeMenu(); }, true);
  byId("zoom-in").onclick = () => { const r = canvas.getBoundingClientRect(); zoomAbout(r.left + r.width / 2, r.top + r.height / 2, 1.1); };
  byId("zoom-out").onclick = () => { const r = canvas.getBoundingClientRect(); zoomAbout(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.1); };

  // ---------------------------------------------------------------------------- starting board

  addPanelNode({
    x: 110, y: 90, w: 360, h: 360, icon: "&#9636;", name: "this is note.md",
    tools: `<span style="color:#5cb6ff">&#9638;</span><span>&#9707;</span><span>&#9707;</span><span>&times;</span>`,
    body: `<span class="ln">1</span>asdf`,
    caption: `<b>Existing node: File Editor</b> · unchanged, shown for context beside the new shapes`,
  });
  const term = addPanelNode({
    x: 570, y: 100, w: 430, h: 260, icon: "&gt;_", name: "pwsh.exe",
    tools: `<span>+</span><span>&#8601;</span><span>&times;</span>`,
    body: `PowerShell 7.6.7<br>PS C:\\jason\\dev\\unluminous&gt;<br>PowerShell 7.6.7<br>PS C:\\jason\\dev\\unluminous&gt; <span style="background:#5cb6ff;color:#5cb6ff">_</span>`,
    caption: `<b>Existing node: Terminal</b> · unchanged, wired to a shape to show shapes connect like any node`,
  });

  const start = addShape("rounded", 1120, 70, 170, 90, "Ticket arrives");
  const decide = addShape("diamond", 1130, 210, 150, 150, "Needs a design?");
  const design = addShape("note", 1360, 220, 160, 140, "Sketch it on a whiteboard realm", { r: 255, g: 192, b: 98, a: 210 });
  Object.assign(design, { align: "left", valign: "top" }); paintShape(design);
  const build = addShape("hexagon", 1120, 420, 170, 100, "Agent builds it", null, { r: 72, g: 159, b: 248, a: 255 });
  addShape("ellipse", 1370, 430, 120, 120, "Ship", { r: 58, g: 214, b: 173, a: 190 });
  addShape("triangle", 140, 520, 150, 130, "Risk");
  const starNode = addShape("star", 340, 510, 140, 140, "Go");
  Object.assign(starNode, { size: 18 }); paintShape(starNode);
  const inputNode = addShape("parallelogram", 540, 440, 190, 90, "Input: realm file");
  addShape("rectangle", 790, 440, 180, 100, "", { r: 61, g: 120, b: 255, a: 80 });
  const join = (a, i, b, j) => links.push({ a: { id: a.id, i }, b: { id: b.id, i: j } });
  join(start, 2, decide, 0);
  join(decide, 1, design, 3);
  join(decide, 2, build, 0);
  join(term, 1, start, 3);
  join(starNode, 1, inputNode, 3);
  drawWires();

  camera.x = 90; camera.y = 20;
  applyCamera();

  // ------------------------------------------------------------------ design only: the state switcher

  /** Opens one state of the design as a right click or a press of Add Node would, on the diamond. */
  function showState(name) {
    closeMenu();
    closePicker(false);
    closeAdd();
    if (decide.el.classList.contains("editing")) stopEditing(decide);
    document.querySelectorAll("#states button").forEach((b) => b.classList.toggle("on", b.dataset.state === name));
    if (name === "none") return;
    if (name === "add") {
      openAdd();
      const shapeRow = [...list.children].find((r) => r.querySelector(".more"));
      shapeRow.scrollIntoView({ block: "nearest" });
      openFlyout(shapeRow);
      search.blur();
      return;
    }
    choose(decide);
    const r = decide.el.getBoundingClientRect();
    // the menu and the picker together are about 530 points wide; open them on whichever side has room
    const roomRight = innerWidth - r.right > 540;
    const x = roomRight ? r.right - 20 : Math.max(8, r.left - 520), y = r.top + r.height / 2 - 60;
    openMenu(decide, x, y);
    if (name === "text") openSub(byId("text-row"));
    if (name === "picker") {
      const menuBox = menu.getBoundingClientRect();
      openPicker(decide, "fill", menuBox.right - 4, menuBox.top + 40);
    }
  }

  const states = byId("states");
  states.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) showState(b.dataset.state); });
  requestAnimationFrame(() => showState("picker"));
})();
</script>
