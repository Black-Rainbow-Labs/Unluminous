<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design</title>
<style>
  :root {
    --ink: #141414;
    --paper: #eeece8;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* The picture fills the page. Its subject is on the right, so the word sits on the open paper at the top
     left, and the picture is anchored to its right edge so a narrow window keeps the hand in view. */
  .hero {
    min-height: 100vh;
    padding: clamp(28px, 4vw, 56px);
    background: var(--paper) url("assets/design-background.jpg") right center / cover no-repeat;
    overflow: hidden;
  }

  .title {
    margin: 0;
    font-size: clamp(88px, 15vw, 248px);
    line-height: 0.82;
    letter-spacing: -0.055em;
    font-weight: 800;
    text-transform: uppercase;
  }

  @media (max-width: 860px) {
    .hero { background-position: 70% center; }
  }
</style>
</head>
<body>

<section class="hero">
  <h1 class="title">Design</h1>
</section>

</body>
</html>
