path = "examples/layout_memory.rs"

[dev-dependencies]
# Reading a font file directly, to check the Word plugin measures what the file says. Already in the tree.
ttf-parser.workspace = true
egui_kittest.workspace = true
# wgpu's own shader compiler, so a test can parse and validate `services/scene_blur.wgsl` with no graphics card.
# The version is the one wgpu already builds.
naga = { version = "30", features = ["wgsl-in"] }
unluminous-dap.workspace = true
# Jupyter notebooks: the .ipynb file, the text a notebook tab edits, and the kernel. `task-2220`.
unluminous-jupyter.workspace = true
# Word documents: the .docx file, its styles and lists, editing, pagination and the exports. `task-2341`.
unluminous-word.workspace = true
unluminous-git.workspace = true
image.workspace = true
