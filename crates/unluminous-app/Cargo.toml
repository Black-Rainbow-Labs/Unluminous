[package]
name = "unluminous-app"
description = "The Unluminous window: file explorer, editor surface, formatting toolbar, transparency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "unluminous"

[features]
# A counting allocator behind the frame trace, and with `UNLUMINOUS_HEAP_PROFILE` the live heap by call site
# (`services::allocation_profile`, `task-2279`).
diagnostic-allocations = ["dep:backtrace"]
# egui's, eframe's and egui-wgpu's own `profiling::scope!` marks as spans, and every slow one written into the
# frame trace as `~<name>` (`services::span_trace`, `task-2288`). Off in a normal build, where the marks are
# compiled to nothing.
diagnostic-spans = ["dep:profiling", "dep:tracing-core", "profiling/profile-with-tracing"]

[lib]
name = "unluminous_app"
path = "src/lib.rs"

[[bin]]
name = "unluminous"
path = "src/main.rs"

[dependencies]
# Only in a build made with `diagnostic-allocations`, for the heap profile's call sites.
backtrace = { version = "0.3", optional = true }
# Only in a build made with `diagnostic-spans`. The versions are the ones egui's own crates already use.
profiling = { version = "1", optional = true, default-features = false }
tracing-core = { version = "0.1", optional = true }
unluminous-core.workspace = true
unluminous-dap.workspace = true
unluminous-lsp.workspace = true
# Jupyter notebooks: the .ipynb file, the text a notebook tab edits, and the kernel. `task-2220`.
unluminous-jupyter.workspace = true
# Word documents: the .docx file, its styles and lists, editing, pagination and the exports. `task-2341`.
unluminous-word.workspace = true
unluminous-git.workspace = true
unluminous-terminal.workspace = true
# The Agent-Chat plugin's half with no window in it: the endpoints, the two wire shapes, the
# server-sent-event framing, the conversation and the thread a request runs on.
unluminous-chat.workspace = true
# Speech to text for the Agent-Chat prompt: the microphone, the "Sable" wake word, Moonshine and an endpoint.
# `task-2290`.
unluminous-voice.workspace = true
# The Database plugin's half with no window in it: the PostgreSQL wire protocol, SQLite, the values a
# grid draws, and the thread a query runs on. See `tasks/task-1777-database-plugin-tdd.md` §2 for why
# the PostgreSQL client is written here rather than taken from `tokio-postgres`.
unluminous-db.workspace = true
# Named only to say what `capabilities()` answers with: the type is the driver's, and Unluminous reads
# the table rather than keeping a copy, so a capability that changes cannot go stale here.
inillucent-driver.workspace = true
rux.workspace = true
# The catalogue of command line commands and the wire format, shared with the client so that the
# two cannot come to disagree about what a command is called. It brings no window with it.
unluminous-cli.workspace = true
# The code index, for registering a language plugin somebody installed (`services::plugins::store`).
atrius-index.workspace = true
serde_json.workspace = true
# The SHA-256 an update's installer is checked against before it is run. Already in the tree through
# `wry` and `unluminous-db`. See `services/update_install.rs`.
sha2.workspace = true
# The client id telemetry sends, made once from the operating system's random source. Already in the tree
# through `unluminous-db`. See `services/telemetry`.
getrandom.workspace = true
url.workspace = true
percent-encoding.workspace = true
mime_guess.workspace = true
egui.workspace = true
eframe.workspace = true
vello_cpu.workspace = true
fontdb.workspace = true
# Font files are mapped rather than copied into the heap (`services::text_renderer::Face`). Already in the
# build through `fontdb`.
memmap2 = "0.9"
ab_glyph.workspace = true
unicode-segmentation.workspace = true
rfd.workspace = true
arboard.workspace = true
muda.workspace = true
# Only the PNG decoder, for the pictures plugins put in front of their files.
image.workspace = true
# The Realm's sound nodes. See the workspace manifest for which formats and why.
rodio.workspace = true
# The Agent-Tasks plugin's board. One file on disk, with SQLite compiled in.
rusqlite.workspace = true
# The one request Unluminous makes on its own behalf: whether a newer release exists, asked only when
# somebody asks for it. `services::update` uses `unluminous-chat`'s own TLS configuration rather than
# a second one -- see the note at the top of that file.
ureq = { workspace = true }
libc.workspace = true

# The application menu on macOS takes its name from the running program, and the program is `unluminous`. Setting
# the process name to `Unluminous` is what makes the menu bar read `Unluminous  File  Edit  View` rather than starting
# with a lower case q. Nothing else here needs Objective C.
[target.'cfg(target_os = "macos")'.dependencies]
# `NSArray`, `NSDate`, `NSDictionary` and `NSHTTPCookie` are for a browser node's session cookies, see below.
objc2-foundation = { workspace = true, features = ["NSArray", "NSDate", "NSDictionary", "NSHTTPCookie"] }
objc2.workspace = true
wry.workspace = true
# A browser node's page is cropped to its part of the canvas with a mask on the web view's own layer,
# because macOS has no window region to set. All four are already in the build through `wry`. `task-2207`.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder", "objc2-quartz-core", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
# A browser node's session cookies are given to and read from WebKit's cookie store directly, with a
# completion block and no waiting. `wry`'s `set_cookie` and `cookies` wait by running the main run loop
# by hand, and a redraw that comes in while they wait reaches `winit` while it is still handling the
# frame that asked, which `winit` answers with a panic and the process aborts. All three are already
# in the build through `wry`.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
# Posting a block to the main dispatch queue, which is how a run loop that has stopped answering
# repaint requests is woken. See `services/wake.rs`.
dispatch2.workspace = true

# Clearing the window's redirection surface, which is what lets the desktop show through on Windows.
# See `services/windows_transparency.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
wry.workspace = true
webview2-com.workspace = true
windows.workspace = true
windows-core.workspace = true

# The icon and the version block inside `unluminous.exe`, put there by `build.rs`. Windows takes a
# program's icon, its taskbar name and its Add or Remove Programs version from a resource compiled
# into the executable, and nothing outside the executable can supply one.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[[example]]
name = "sample_design"
path = "examples/sample_design.rs"

[[example]]
name = "terminal_capture"
path = "examples/terminal_capture.rs"

[[example]]
name = "shrink"
path = "examples/shrink.rs"

[[example]]
name = "scale"
path = "examples/scale.rs"

[[example]]
name = "crop"
path = "examples/crop.rs"

[[example]]
name = "plugin_icon"
path = "examples/plugin_icon.rs"

[[example]]
