# An Unluminous plugin. See the HTML one for what `language.markup` does.
#
# XML is read by the same five states HTML is: text, tag name, attribute, value and raw text. It
# names no elements, because XML has none of its own, so every tag name is drawn in the type color
# the markup reading gives an element the language does not name. The HTML plugin's limitations say
# it deliberately does not claim XML; this is the plugin that does.

plugin.id          = xml
plugin.name        = XML
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for XML and the file types written in it: Maven and Ant builds, .NET project files, XAML, XSLT, XML schemas, Android layouts and Apple property lists. Tag names, attribute names, attribute values, entity references, comments and the XML declaration are told apart.
plugin.limitations = A CDATA section is read as text inside the tag that holds it, so markup characters inside one are not colored as tags only when they do not look like a tag. A namespace prefix is part of the tag name, so `xs:element` is one word in one color. A DOCTYPE with an internal subset is colored as one tag. SVG is not claimed, because Unluminous opens an .svg file as a picture.

language.extensions     = .xml, .xsd, .xsl, .xslt, .xaml, .wsdl, .plist, .csproj, .fsproj, .vbproj, .vcxproj, .proj, .props, .targets, .nuspec, .resx, .iml, .pom, .rss, .atom, .xliff, .xlf, .jelly, .tld, .xhtml
language.file_names     = web.config, app.config, packages.config, nuget.config
language.block_comment  = <!--, -->
language.strings        = ", '
language.escapes        = false
language.numbers        = false
# A hyphen, a dot and a colon are all legal in an XML name, and a namespace prefix such as `xs:` is
# part of the name it is written in front of.
language.word_characters = -, ., :
language.markup         = true
language.operators      = <>=/!?

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
