# An Unluminous plugin. See the Rust one for what the format is.
#
# JSON with comments, which the JSON plugin deliberately does not read: a comment in a `.json` file
# is a mistake, and coloring it as accepted would hide the mistake. But `tsconfig.json`, VS Code's
# settings, `.eslintrc.json` and a dev container's `devcontainer.json` are read by programs that
# accept comments, and they are named `.json`. A name beats an extension, so those files are claimed
# here by name while every other `.json` file stays JSON.

plugin.id          = jsonc
plugin.name        = JSON with Comments
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for JSON with comments and JSON5: .jsonc and .json5 files, and the configuration files whose readers accept comments, such as tsconfig.json, jsconfig.json, .eslintrc.json, devcontainer.json, .babelrc and VS Code's own settings. Comments of both kinds, keys, strings, numbers and the literal values are told apart.
plugin.limitations = A key is colored as a string, because JSON keys are strings and a key in JSON5 that is not quoted is read as a plain word. VS Code's settings.json is claimed only when its folder is not part of the name, so a settings.json in any folder is read as JSON with comments. A trailing comma, which these readers accept, is colored as the punctuation it is.

language.extensions    = .jsonc, .json5
language.file_names    = tsconfig.json, tsconfig.*.json, jsconfig.json, jsconfig.*.json, .eslintrc.json, .eslintrc, .babelrc, .babelrc.json, .swcrc, devcontainer.json, .devcontainer.json, settings.json, launch.json, tasks.json, extensions.json, keybindings.json, .jshintrc, .jscsrc, api-extractor.json, typedoc.json, turbo.json, deno.json, deno.jsonc, biome.json
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = {}[]:,-+

language.builtins = true, false, null, Infinity, NaN

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
