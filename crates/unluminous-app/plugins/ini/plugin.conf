# An Unluminous plugin. See the Rust one for what the format is.
#
# INI is not one format but a family, and the members an engineer opens most are named here by file
# name because they have no extension Rust reports: `.editorconfig`, `.gitconfig`, `.gitmodules`,
# `.npmrc`. All of them are `[section]` lines over `name = value` lines, which `language.sections` and
# `language.keys` read.

plugin.id          = ini
plugin.name        = INI
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for INI files and the configuration files written in the same shape: .editorconfig, .gitconfig, .gitmodules, .npmrc, setup.cfg, tox.ini, php.ini and Windows .inf and desktop entry files. Section headers, the name each line sets, comments written with ; or #, quoted values, numbers and boolean values are told apart.
plugin.limitations = A section header is colored as one word, brackets included, so `[remote "origin"]` is one color rather than a header with a quoted name inside it. A value continued onto an indented line, which Python's configparser allows, is read as a line of its own. A `.conf` file is not claimed: nginx, Apache and systemd all use the extension for files that are not INI, and coloring them as INI would be wrong more often than right.

language.extensions    = .ini, .cfg, .cnf, .inf, .desktop
language.file_names    = .editorconfig, .gitconfig, .gitmodules, .npmrc, .pypirc, .wslconfig, .pylintrc, .flake8, .coveragerc, gitconfig
language.line_comment  = ;
# See the Python plugin for why a bare `#` is safe as the first value here.
language.more_line_comments = #
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = =:[]
language.keys          = =
language.sections      = true

language.builtins = true, false, yes, no, on, off, True, False, Yes, No, On, Off, TRUE, FALSE, YES, NO, ON, OFF

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
