# An Unluminous plugin. See the Rust one for what the format is.
#
# The first plugin that claims files by name rather than by extension (`task-2384`). A Dockerfile is
# called `Dockerfile`, which Rust's `Path::extension` reads as having no extension at all, and a
# second one in the same folder is usually `Dockerfile.dev` or `Dockerfile.prod`, whose "extension" is
# the stage name. `language.file_names` matches the whole name, with one `*`, and a name beats an
# extension, so `Dockerfile.dev` is a Dockerfile whatever plugin later claims `.dev`.

plugin.id          = dockerfile
plugin.name        = Dockerfile
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for Dockerfiles and Containerfiles. The instructions, comments, quoted strings, numbers, the flags an instruction takes such as --from and --mount, and the name an ENV or ARG line sets are told apart.
plugin.limitations = The instructions are matched as they are written in upper case and in lower case, and not in mixed case, which Docker accepts and nobody writes. The command after RUN, CMD and ENTRYPOINT is shell and is colored as plain words: a Dockerfile does not say which shell its image has, and coloring it as Bash would be wrong for every Windows image. A heredoc (`RUN <<EOF`) is read line by line rather than as one block. A parser directive such as `# syntax=docker/dockerfile:1` is colored as the comment it is written as.

language.extensions    = .dockerfile, .containerfile
language.file_names    = Dockerfile, Dockerfile.*, Containerfile, Containerfile.*
# See the Python plugin for why a bare `#` is safe as this value.
language.line_comment  = #
language.strings       = ", '
language.escapes       = true
language.numbers       = true
# A hyphen is a letter, so `apt-get`, `--no-install-recommends` and `--from` are each one word.
language.word_characters = -
language.operators     = =\[]{}&|;<>:$
# `ENV NAME=value` and `ARG VERSION=1.2`: the name before the `=` is a key, because the instruction
# in front of it is a keyword and keywords may stand before a key.
language.keys          = =

language.keywords = FROM, AS, RUN, CMD, LABEL, MAINTAINER, EXPOSE, ENV, ADD, COPY, ENTRYPOINT, VOLUME, USER, WORKDIR, ARG, ONBUILD, STOPSIGNAL, HEALTHCHECK, SHELL, from, as, run, cmd, label, maintainer, expose, env, add, copy, entrypoint, volume, user, workdir, arg, onbuild, stopsignal, healthcheck, shell

# The flags the instructions themselves take. A flag of the program a RUN line starts is not here,
# for the reason a shell plugin does not list `grep`'s options.
language.builtins = --from, --chown, --chmod, --link, --parents, --exclude, --platform, --mount, --network, --security, --interval, --timeout, --start-period, --start-interval, --retries, --keep-git-dir, --checksum, NONE

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
