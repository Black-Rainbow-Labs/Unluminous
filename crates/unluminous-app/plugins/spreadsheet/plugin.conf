# An Unluminous plugin that draws. See the JavaScript one for what a language plugin is; this one opens a
# file type in a tab of its own, as the Realm plugin opens a `.realm` file, and adds a menu and a Settings page.
#
# `ui.provider` names code that shipped inside Unluminous. The arrangement below is data and can be changed
# by hand; the drawing cannot, which is what stops a manifest deciding the window's colours.

plugin.id          = spreadsheet
plugin.name        = Spreadsheet
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = ui
plugin.description = Excel workbooks and CSV files, opened, edited and saved in a tab of their own. A workbook keeps everything Excel wrote into it, including what this version does not show, and Excel opens what Unluminous saves with no repair. Formulas are recalculated as cells change, with over 330 of Excel's functions, dynamic arrays that spill, LET, LAMBDA and XLOOKUP among them, each checked against Excel itself. There is no ribbon: one bar holds the name box, the formula bar, Format and a menu of everything with a search box, and the Format panel goes from Number, Font, Fill, Borders, Alignment, Rules and Data down to the choice you want. Sheets, number formats, fonts, fills, borders, merged cells, frozen panes, filters, sorting, conditional formats, data validation, notes, links, tables, defined names and charts are all here, the keys are Excel's, and copying and pasting work with Excel and every other program.
plugin.limitations = .xls, .xlsb and .ods are not read; Excel or LibreOffice can save them as .xlsx. A workbook with macros keeps them and they never run. Pivot tables, slicers, sparklines, shapes, pictures, form controls, icon sets and comments in threads are kept in the file and not shown. A chart Excel made is kept exactly as it was and shown as its kind, title and series; a chart made here is a column, bar, line, area, pie, doughnut or scatter chart of a block of data, with Excel's own look. Functions this version does not compute, and references to other workbooks, keep the value the file saved until the cell is changed. Protected sheets are kept protected and their locked cells refuse a change. A CSV file holds one sheet, so saving one writes the sheet that is showing.

ui.provider = spreadsheet

# The file types this plugin opens instead of a text tab. `Open as Text` still opens a CSV as text.
ui.extensions = .xlsx, .xlsm, .csv, .tsv

# The menu, added after Unluminous's own six. Each entry is a `plugins run spreadsheet` command, acting on the
# workbook showing.
menu.name    = Spreadsheet
menu.entries = panel=Format Panel, find-bar=Find in Sheet, -, recalc=Recalculate, autosum=AutoSum, -, freeze=Freeze Panes Here, gridlines=Show Gridlines

# The page in Settings: what a sheet is drawn on, and whether the list of functions opens while a formula is typed.
settings.page = Spreadsheet
settings.icon = table
