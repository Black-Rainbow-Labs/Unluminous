# An Unluminous plugin that draws. See the JavaScript one for what a language plugin is; this one adds a
# pane, a menu and a Settings page instead of a file type.
#
# `ui.provider` names code that shipped inside Unluminous. The arrangement below is data and can be changed
# by hand; the drawing cannot, which is what stops a manifest deciding the window's colours.

plugin.id          = designer
plugin.name        = Designer
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = ui
plugin.description = Design a screen in HTML with the agent you already have beside you. A design is one HTML file in the project's designs folder, `.designs` unless Settings says otherwise, and opens in a tab of the Designer pane, which draws the page at the width of a device. The pane keeps its own tabs, apart from the files open in the editing area, starts with a blank tab that lists the designs, and remembers which designs were open. Select an element by clicking it, leave a note on it like a pin on a canvas, and press Ask agent: the note, the element's selector, its text and the start of its markup go to the Agent-Chat pane, and the agent changes the file while the page reloads. A note is a thread that is open or resolved, a note whose element has gone is marked Detached rather than lost, and the design is copied before every request so History can put it back.
plugin.limitations = One design is one HTML file, drawn as one page: there is no canvas of several artboards, no dragging an element and no style panel, because a second editor of the file beside the agent and the text editor would need a way to merge two writers, and this version has none. There are no variants side by side, only the copies History keeps. Unluminous runs no model of its own, so a request needs the Agent-Chat pane switched on and an agent set up in it. Notes are a file beside the design, so they are shared the way any file in the project is shared, through git; two people commenting at once is two people editing one file. A design may link stylesheets, scripts and pictures beside it in the project and they load as they do in a browser tab; one that is not HTML, such as a React component or an image, is not a design. The page is drawn by the window's one native web view, which no screenshot Unluminous takes can hold, so `window screenshot` of a design shows the toolbar, the sidebar and the prompt box and an empty rectangle where the page is.

ui.provider = designer

# The decoration `egui` cannot draw: soft shadows, inset shadows, gradients and rounded clips, rendered by
# `services::vello_canvas`. Named from `plugins::CHROME`, checked, and refused with the list if this version
# of Unluminous has no such renderer. Take this line out and the plugin draws flat, in the same frame.
ui.chrome = vello

# The Designer pane, docked to the left. It has tabs of its own: a blank tab lists the designs, and a design opens
# in a tab beside it rather than in the editing area. The window draws the pane's body (`app::designer`) because a
# window has one native web view and only the window owns it.
pane.id      = designs
pane.label   = Designer
pane.icon    = design
pane.side    = left
pane.group   = top
pane.width   = 900
pane.height  = 320
pane.applies = always

# The menu, added after Unluminous's own six. A lone `-` is a separator. `open-pane` is the window's own name
# for "put this plugin's pane on the screen", so the menu entry, the rail button and
# `unluminous-cli plugins run designer open-pane` are one path.
menu.name    = Designer
menu.entries = open-pane=Show Designer, new-tab=New Designer Tab, new=New Design..., -, ask-all=Send Open Notes to Agent, history=Design History, -, mode-browse=Browse, mode-select=Select, mode-comment=Comment

# The page in Settings: where the designs are kept, the device a design opens at, the starter page, how much
# of an element goes with a request, and how many copies History keeps.
settings.page = Designer
settings.icon = design

# A dot folder the explorer lists. Another folder named in Settings is added by the window when it starts
# with a dot.
explorer.shows = .designs
