# The Realm: infinite canvases kept as .realm files in the project. `task-2202`, from the design in
# `tasks/task-2199-realm-tdd.md`.
#
# A `ui` plugin whose provider is core. The canvas itself is drawn by the window, because a note node needs
# the editing area's own tabs and a video node needs the window's one native web view, and no provider can
# reach either (`app::dock::Panel::Realm` says so). What this manifest contributes is the file type, its
# icon, and the folder new realms go in; switching it off takes the panel, its rail button and its menu
# away, the way switching Agent-Tasks off takes its pane away.
#
# **No `pane.` or `menu.` keys**, though the design listed them. Those keys make a plugin pane drawn by a
# provider object, and this provider is the window, so they would put a second, empty pane beside the real
# one. The panel, its rail button and its `View -> Realm` menu are the window's, and this plugin is what
# turns them on.

plugin.id          = realm
plugin.name        = Realm
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = ui
plugin.description = Infinite canvases saved as .realm files in the project: terminals, web pages, folder trees, file editors, Markdown notes, pictures, sounds and videos, wired together so an agent in one node can drive the nodes it is connected to.
plugin.limitations = One realm is open at a time. A video plays in the window's one native web view, so only the chosen video node or browser node shows a page and the rest show a placeholder, and no screenshot Unluminous takes contains a playing video. A realm file that a newer Unluminous wrote may open for reading only; `realm info` says why.

ui.provider = realm

# A .realm file opens in the Realm panel rather than as text, and this plugin's icon is what the explorer
# and the tabs draw for one.
ui.extensions = .realm

# New realms and their notes go in `.realm-files/`, which the explorer would otherwise hide with every other
# folder whose name starts with a dot.
explorer.shows = .realm-files
