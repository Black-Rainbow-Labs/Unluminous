# An Unluminous plugin. See the Rust one for what the format is.
#
# `task-2384`. The language keys below are the code index's own manifest for C (atrius-index
# `languages/c.conf`), so Go to Definition and completion read this language exactly as they did
# when the index was the only thing that knew it; what this plugin adds is the colors and the icon.
# Two index keys are left out, `definition_tail` and `brace_next_line`, because only the index reads them.

plugin.id          = c
plugin.name        = C
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for C source and header files. Keywords, builtins, strings, numbers and comments are told apart, and the definitions the code index reads are found by Go to Definition.
plugin.limitations = A function is found when its parameter list opens and closes on one line, followed by its opening brace on that line or the next. A macro is not a definition. A function like macro used before a brace reads as a likely definition.

language.extensions    = .c, .h
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.

language.keywords = auto, break, case, char, const, continue, default, do, double, else, enum, extern, float, for, goto, if, inline, int, long, register, restrict, return, short, signed, sizeof, static, struct, switch, typedef, union, unsigned, void, volatile, while, _Bool, _Atomic, _Static_assert, _Alignof, _Alignas, _Generic, _Noreturn, _Thread_local, defined
language.builtins = NULL, size_t, ssize_t, uint8_t, uint16_t, uint32_t, uint64_t, int8_t, int16_t, int32_t, int64_t, bool, true, false, printf, malloc, free, memcpy, memset, strlen

language.definers          = struct=type, enum=type, union=type
language.brace_definitions = true

# The structural reading (Unluminous task-2231): which blocks hold members and of what kind, how a
# type is written beside a name and after a parameter list, who may use a definition, and what reaches
# a member. Completion reads these to offer the members of a type, show what a function takes and
# returns, and know what a field or a variable holds. Every key is optional.
language.containers = struct, enum, union
language.records    = struct, union
language.enums      = enum
language.kinds      = struct=struct, enum=enum, union=struct
language.members    = ., ->

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
