# An Unluminous plugin. See the Rust one for what the format is.
#
# A `.env` file is the other file `task-2384` names that Rust reads as having no extension: `.env`
# is all stem. `.env.local` and `.env.production` do have one, and it is the environment's name, so
# the whole family is claimed by name. `language.keys` is what makes the file worth coloring at all:
# every line is `NAME=value`, and the name is what a reader is looking for.

plugin.id          = dotenv
plugin.name        = .env
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for .env files. The name each line sets, its value when it is quoted, numbers, comments and the export word some files put in front of a name are told apart.
plugin.limitations = A value that is not quoted is plain text, because it is whatever the program reading the file makes of it. A reference to another variable inside a value, `${HOME}` or `$HOME`, is colored as part of the value. A quoted value that runs across lines is colored on its first line only, which is the string rule every plugin here shares. A `#` after an unquoted value starts a comment here, which is what dotenv in Node and python-dotenv both do, and is not what Docker Compose's own reader does.

language.extensions    = .env
language.file_names    = .env, .env.*, *.env.example, *.env.sample
# See the Python plugin for why a bare `#` is safe as this value.
language.line_comment  = #
language.strings       = ", ', `
language.escapes       = true
language.numbers       = true
language.operators     = =
language.keys          = =

# `export NAME=value` is how a file meant to be sourced by a shell writes a line, and dotenv readers
# accept it. Listing it as a keyword is also what lets the name after it read as a key.
language.keywords = export
language.builtins = true, false

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
