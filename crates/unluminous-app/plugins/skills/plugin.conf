# The Skills Manager, `task-2396`. An Unluminous plugin that draws: a pane, a menu and a Settings page. See
# `tasks/task-2396-skills-manager-tdd.md`.
#
# `ui.provider` names code that shipped inside Unluminous; the arrangement below is data and can be changed by hand.

plugin.id          = skills
plugin.name        = Skills Manager
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = ui
plugin.description = Agent skills for every coding agent. The pane shows the most used skills from unluminous.com, the skills Unluminous ships for its Agent-Tasks board, your own, and every skill already installed on this machine, each as a card with its picture. Install one into Claude Code, Codex, OpenCode, Pi, Gemini CLI, Cursor, GitHub Copilot and ten more, for this project or for every project, and remove it again. Make your own with New Skill, and edit any skill's SKILL.md in a tab: saving it updates every place it is installed. When unluminous.com publishes a newer skill, its card says so.
plugin.limitations = Nothing in a skill is run by Unluminous: a script in a skill's folder is copied with it. unluminous.com is read when the pane is shown and at most every six hours, and a skill's files are fetched only when it is installed or updated. A copy of a skill that Unluminous did not write is never replaced or removed without force. A coding agent that is not in the list can still be given skills through Settings, which names more folders to look in.

ui.provider = skills
ui.chrome   = vello

# The Skills Manager pane, docked on the right.
pane.id      = skills
pane.label   = Skills
pane.icon    = blocks
pane.side    = right
pane.group   = top
pane.width   = 760
pane.height  = 420
pane.applies = always

menu.name    = Skills
menu.entries = open-pane=Show Skills Manager, new=New Skill..., check=Check for Updates, -, filter-installed=Show Installed Skills, filter-all=Show All Skills

settings.page = Skills
settings.icon = blocks
