# An Unluminous plugin. See the Rust one for what the format is.
#
# `task-2384`. The language keys below are the code index's own manifest for Lua (atrius-index
# `languages/lua.conf`), so Go to Definition and completion read this language exactly as they did
# when the index was the only thing that knew it; what this plugin adds is the colors and the icon.
# Two index keys are left out, `definition_tail` and `brace_next_line`, because only the index reads them.

plugin.id          = lua
plugin.name        = Lua
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for Lua scripts. Keywords, builtins, strings, numbers and comments are told apart, and the definitions the code index reads are found by Go to Definition.
plugin.limitations = A function written as function M.name or M:name is not found, because the dot ends the definition. A long bracket string is read as text.

language.extensions    = .lua
language.line_comment  = --
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>~:;,.^

language.keywords = and, break, do, else, elseif, end, false, for, function, goto, if, in, local, nil, not, or, repeat, return, then, true, until, while
language.builtins = print, pairs, ipairs, require, setmetatable, getmetatable, table, string, math, type, tostring, tonumber, error, pcall

language.definers = function=function, local=variable

# The structural reading (Unluminous task-2231): which blocks hold members and of what kind, how a
# type is written beside a name and after a parameter list, who may use a definition, and what reaches
# a member. Completion reads these to offer the members of a type, show what a function takes and
# returns, and know what a field or a variable holds. Every key is optional.
language.members = ., :

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
