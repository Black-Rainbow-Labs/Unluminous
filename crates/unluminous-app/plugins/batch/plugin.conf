# An Unluminous plugin. See the Rust one for what the format is.
#
# A batch file comments with `REM` or with `::`, and `REM` ends in a letter, which no comment opener
# did before `task-2384`. An opener that ends in a letter only opens a comment when the next
# character is not part of a word, so `REMOTE` and `REMARK` stay words.

plugin.id          = batch
plugin.name        = Batch
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for Windows batch files. Commands, comments written with REM or ::, labels, %variables%, quoted strings and numbers are told apart.
plugin.limitations = Commands are matched in upper case, lower case and with a capital first letter, though cmd.exe ignores case altogether. `REM` opens a comment wherever it is written as a word, including after an `&` on the same line, which is where cmd.exe also reads one. A variable reference is colored by its percent signs, and the name between them is plain text. Delayed expansion, `!name!`, is read the same way.

language.extensions    = .bat, .cmd
language.line_comment  = REM
language.more_line_comments = ::, rem, Rem, @REM, @rem
language.strings       = "
language.escapes       = false
language.numbers       = true
language.operators     = %!@&|<>()=:^
language.keys          = =

# `set NAME=value` names a key the way `export NAME=value` does in a .env file.
language.keywords = if, else, for, in, do, goto, call, exit, set, setlocal, endlocal, shift, not, exist, defined, errorlevel, equ, neq, lss, leq, gtr, geq, IF, ELSE, FOR, IN, DO, GOTO, CALL, EXIT, SET, SETLOCAL, ENDLOCAL, SHIFT, NOT, EXIST, DEFINED, ERRORLEVEL, EQU, NEQ, LSS, LEQ, GTR, GEQ, If, Else, For, Set, Call, Exit, Goto

language.builtins = echo, cd, chdir, cls, copy, del, erase, dir, md, mkdir, rd, rmdir, move, ren, rename, type, start, pause, pushd, popd, title, color, ver, vol, path, prompt, assoc, ftype, mklink, where, timeout, choice, findstr, find, xcopy, robocopy, ECHO, CD, CLS, COPY, DEL, DIR, MD, MKDIR, RD, RMDIR, MOVE, REN, TYPE, START, PAUSE, PUSHD, POPD, TITLE, Echo, off, on, OFF, ON, nul, NUL, ENABLEDELAYEDEXPANSION, ENABLEEXTENSIONS, enabledelayedexpansion, enableextensions

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
