# An Unluminous plugin. See the Rust one for what the format is.
#
# `task-2384`. The language keys below are the code index's own manifest for Ruby (atrius-index
# `languages/ruby.conf`), so Go to Definition and completion read this language exactly as they did
# when the index was the only thing that knew it; what this plugin adds is the colors and the icon.
# Two index keys are left out, `definition_tail` and `brace_next_line`, because only the index reads them.

plugin.id          = ruby
plugin.name        = Ruby
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for Ruby source files, Rakefiles, Gemfiles and gem specifications. Keywords, builtins, strings, numbers and comments are told apart, and the definitions the code index reads are found by Go to Definition.
plugin.limitations = A method written as def self.name is not found, because the dot ends the definition. A block's end is found by indentation. A percent literal and a heredoc are read as text.

language.extensions    = .rb, .rake, .gemspec, .ru
language.file_names    = Rakefile, Gemfile, Guardfile, Podfile, Vagrantfile, Brewfile, Fastfile, Appfile, Dangerfile, Berksfile, Thorfile, .irbrc, .pryrc, config.ru
language.line_comment  = #
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.@

language.keywords = BEGIN, END, alias, and, begin, break, case, class, def, defined, do, else, elsif, end, ensure, false, for, if, in, module, next, nil, not, or, redo, rescue, retry, return, self, super, then, true, undef, unless, until, when, while, yield, attr_reader, attr_writer, attr_accessor, require, require_relative, private, protected, public
language.builtins = puts, print, p, raise, lambda, proc, Array, Hash, String, Integer, Struct

language.definers = def=function, class=type, module=module

# The structural reading (Unluminous task-2231): which blocks hold members and of what kind, how a
# type is written beside a name and after a parameter list, who may use a definition, and what reaches
# a member. Completion reads these to offer the members of a type, show what a function takes and
# returns, and know what a field or a variable holds. Every key is optional.
language.containers = class, module
language.kinds      = class=class, module=module
language.members    = ., ::

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
