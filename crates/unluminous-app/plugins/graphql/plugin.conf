# An Unluminous plugin. See the Rust one for what the format is.

plugin.id          = graphql
plugin.name        = GraphQL
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for GraphQL schemas and documents. Keywords, the built in scalar types, variables, directives, strings, numbers and comments are told apart, and a type, an interface, an enum, an input, a union, a scalar and a fragment are found by Go to Definition.
plugin.limitations = A block string (`"""..."""`) runs across lines and is colored on its first line only, which is the string rule every plugin here shares, so a description written as one is plain text after its first line. A field name and an argument name are plain text, because telling them apart needs the brackets read as structure.

language.extensions    = .graphql, .graphqls, .gql
language.line_comment  = #
language.strings       = "
language.escapes       = true
language.numbers       = true
language.operators     = {}()[]:!=|&@$.,

language.keywords = query, mutation, subscription, fragment, on, type, interface, union, enum, input, scalar, schema, extend, directive, implements, repeatable
language.builtins = true, false, null, @deprecated, @skip, @include, @specifiedBy, @oneOf
language.types = Int, Float, String, Boolean, ID
language.word_characters = @

language.definers = type=type, interface=type, enum=type, input=type, union=type, scalar=type, fragment=function, query=function, mutation=function, subscription=function

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
