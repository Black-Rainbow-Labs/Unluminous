# An Unluminous plugin. See the Rust one for what the format is.
#
# PowerShell's cmdlets are written `Verb-Noun`, so a hyphen is a letter here as it is in CSS: without
# it `Get-ChildItem` would be three tokens and `-Recurse` an operator and a word. The cost is that
# `$i-1` reads as one word, which is written into the limitations rather than hidden.

plugin.id          = powershell
plugin.name        = PowerShell
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for PowerShell scripts, modules and data files. Keywords, the comparison operators such as -eq and -like, the automatic variables such as $PSScriptRoot, cmdlet names, comments of both kinds, both kinds of string and numbers are told apart, and a function is found by Go to Definition.
plugin.limitations = A subtraction written with no spaces, `$i-1`, is read as one word because a hyphen is a letter here, which is what keeps `Get-ChildItem` one word. Keywords are matched in lower case and in the capitalization most scripts use, and not in any other mix, although PowerShell ignores case. A cmdlet is colored as a type because it starts with a capital letter, not because it is known. A here-string (`@" ... "@`) is colored on its first line only, which is the string rule every plugin here shares. A backtick escapes the next character in a double quoted string and is read here as an ordinary character.

language.extensions    = .ps1, .psm1, .psd1, .ps1xml, .pssc, .psrc
# See the Python plugin for why a bare `#` is safe as this value.
language.line_comment  = #
language.block_comment = <#, #>
language.strings       = ", '
language.escapes       = false
language.numbers       = true
language.word_characters = -
language.operators     = +*/%=<>!&|;,.:@(){}[]

language.keywords = begin, break, catch, class, continue, data, define, do, dynamicparam, else, elseif, end, enum, exit, filter, finally, for, foreach, from, function, hidden, if, in, param, process, return, static, switch, throw, trap, try, until, using, var, while, workflow, Begin, Break, Catch, Class, Continue, Do, Else, ElseIf, End, Enum, Exit, Filter, Finally, For, ForEach, Function, If, In, Param, Process, Return, Switch, Throw, Trap, Try, Until, Using, While

language.builtins = -eq, -ne, -gt, -ge, -lt, -le, -like, -notlike, -match, -notmatch, -contains, -notcontains, -in, -notin, -replace, -split, -join, -and, -or, -not, -xor, -band, -bor, -bxor, -bnot, -is, -isnot, -as, -f, -ceq, -cne, -clike, -cmatch, -ieq, -ilike, -imatch, $true, $false, $null, $_, $PSItem, $args, $input, $this, $PSScriptRoot, $PSCommandPath, $PSBoundParameters, $MyInvocation, $Host, $HOME, $PWD, $env, $Error, $LASTEXITCODE, $ErrorActionPreference, $PSVersionTable, $IsWindows, $IsLinux, $IsMacOS

language.types = string, int, long, bool, double, decimal, char, byte, array, hashtable, object, void, datetime, regex, xml, scriptblock, switch, psobject, pscustomobject, ordered, guid, version, uri

language.definers = function=function, filter=function, class=type, enum=type

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
