# An Unluminous plugin. See the Rust one for what the format is.
#
# `Makefile` has no extension, so it is claimed by name. A target line is `name: prerequisites` and
# a variable line is `NAME = value`, `NAME := value` or `NAME ?= value`, and `language.keys` reads the
# name in front of all of them. A recipe line starts with a tab and is shell, which is drawn as plain
# words, for the reason the Dockerfile plugin gives about RUN.

plugin.id          = makefile
plugin.name        = Makefile
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for Makefiles. Targets, variable names, the conditional and include directives, the built in functions such as wildcard and patsubst, the automatic variables, comments and strings are told apart.
plugin.limitations = A variable written as `NAME ?= value` or `NAME += value` is not read as a key, because `?` and `+` are not delimiters here; `NAME = value`, `NAME := value` and `NAME ::= value` are. A target whose name holds a `$(variable)` is not read as a key. A recipe line is plain words, and a `#` inside a recipe starts a comment here although make hands it to the shell. A function name is colored inside `$(...)` because it is listed, not because its position is read.

language.extensions    = .mk, .mak, .make
language.file_names    = Makefile, makefile, GNUmakefile, *.mk
# See the Python plugin for why a bare `#` is safe as this value.
language.line_comment  = #
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.word_characters = -, .
language.operators     = =:?+$()@%<^*|;{}
language.keys          = =, :

language.keywords = ifeq, ifneq, ifdef, ifndef, else, endif, include, -include, sinclude, define, endef, export, unexport, override, private, vpath, undefine, .PHONY, .SUFFIXES, .DEFAULT, .PRECIOUS, .INTERMEDIATE, .SECONDARY, .SECONDEXPANSION, .DELETE_ON_ERROR, .IGNORE, .LOW_RESOLUTION_TIME, .SILENT, .EXPORT_ALL_VARIABLES, .NOTPARALLEL, .ONESHELL, .POSIX, .DEFAULT_GOAL

language.builtins = subst, patsubst, strip, findstring, filter, filter-out, sort, word, words, wordlist, firstword, lastword, dir, notdir, suffix, basename, addsuffix, addprefix, join, wildcard, realpath, abspath, error, warning, info, shell, origin, flavor, foreach, if, or, and, call, eval, file, value, let, intcmp, MAKE, MAKEFLAGS, MAKECMDGOALS, CURDIR, SHELL, CC, CXX, CFLAGS, CXXFLAGS, LDFLAGS, LDLIBS, CPPFLAGS

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
