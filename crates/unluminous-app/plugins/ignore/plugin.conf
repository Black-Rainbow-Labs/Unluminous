# An Unluminous plugin. See the Rust one for what the format is.
#
# `.gitignore` and its relatives are all stem and no extension as far as Rust's `Path` is concerned,
# so every one of them is claimed by name. Before `task-2384` a `.gitignore` was plain text, which
# also meant the Bold and Italic controls were offered for it.

plugin.id          = ignore
plugin.name        = Ignore File
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for .gitignore, .dockerignore, .npmignore and the other ignore files, and for .gitattributes. Comments, the negating !, the wildcards and the folder separators are told apart.
plugin.limitations = A pattern is plain text with its wildcards colored; nothing checks it against the files in the project. A `#` that is escaped with a backslash at the start of a line, which git reads as part of a file name, is read here as a comment. In .gitattributes the attributes after a pattern, such as `text eol=lf`, are plain words with their `=` colored.

language.file_names    = .gitignore, .dockerignore, .npmignore, .prettierignore, .eslintignore, .stylelintignore, .hgignore, .ignore, .rgignore, .gcloudignore, .vscodeignore, .helmignore, .slugignore, .cfignore, .gitattributes, .git-blame-ignore-revs
# See the Python plugin for why a bare `#` is safe as this value.
language.line_comment  = #
language.strings       =
language.escapes       = false
language.numbers       = false
language.operators     = !*?/[]=-

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
