# An Unluminous plugin that draws. See the JavaScript one for what a language plugin is; this one adds a
# pane, a tab, a menu and a Settings page instead of a file type.
#
# `ui.provider` names code that shipped inside Unluminous. The arrangement below is data and can be changed
# by hand; the drawing cannot, which is what stops a manifest deciding the window's colours.

plugin.id          = agent-tasks
plugin.name        = Agent-Tasks
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = ui
plugin.description = A task board whose tickets are worked by an agent in a terminal Unluminous owns. Four lanes, cards with todos and comments, a terminal for each ticket, and a session that is resumed by the agent's own conversation id rather than by a process that outlives the editor.
plugin.limitations = The board is a pane, so it is docked to an edge and shares the window with the editing area rather than filling it; four lanes want room, and a pane dragged to the bottom edge is as wide as the window. A description or a comment read as markdown shows headings, lists, quotes, tables and fenced code, and does not show pictures or Mermaid diagrams: resolving those needs the window to decode an image and lay a diagram out, which a plugin cannot do, so a picture shows the words that were written for it instead. The board is local to this machine and its database is one SQLite file, so it is a different board from the browser one and nothing syncs between them. Slack, the phone page and the browser login are absent: they are features of a server that serves other clients. A ticket's terminal ends when Unluminous closes, and Resume session starts a new one on the same agent conversation. Resume session works for Claude, which takes the session id it is given, and not for Codex, which names its own: a Codex ticket is started again rather than resumed, and the ticket's comments are what the new agent reads. JIRA needs three values in the machine's keychain, and with none configured every JIRA control is absent.

ui.provider = agent-tasks

# The decoration `egui` cannot draw: soft shadows, inset shadows, gradients and rounded clips, rendered by
# `services::vello_canvas`. Named from `plugins::CHROME`, checked, and refused with the list if this version
# of Unluminous has no such renderer — the rule `language.renders`, `run.project` and `debug.adapter` all keep.
# Take this line out and the board draws flat, in the same frame. See `tasks/agent-tasks-vello-ui-tdd.md`.
ui.chrome = vello

# **A pane, not a tab.** `task-1848`: "Agent tasks should be its own pane, rather than a tab."
#
# It was a pane until `task-28` took it away, on the grounds that a board in a 420 point column shows one
# lane at a time and needs sideways scrolling to see the second. That reasoning holds for a *narrow* pane
# and not for this ask: `task-1697`'s docking means a pane is dragged to any edge, so this one starts at
# 900 points wide and can be given the whole bottom of the window. `pane.width` is what decides that, and
# a person who wants it narrow drags it narrow.
#
# The cost is stated rather than hidden: a pane is narrower than the editing area was, so a board with
# four lanes showing is a board that has to be given room. That is the trade the ask makes and it is
# reversible in one drag.
#
# `components::agent_tasks::pane` already draws the whole board — the rail, the view switch, the lanes and
# the modal — so this is a manifest change and nothing more. Unluminous's pane machinery was left in place
# by `task-28` deliberately, which is what makes it one.
pane.id      = board
pane.label   = Agent-Tasks
pane.icon    = board
pane.side    = bottom
pane.group   = bottom
pane.width   = 900
pane.height  = 420
pane.applies = always

# The menu, added after Unluminous's own six. A lone `-` is a separator.
menu.name                = Agent-Tasks
# No `Sync JIRA` entry. JIRA is not implemented on this board, and Unluminous's rule is that a control which
# cannot apply is absent rather than present and refusing. `plugin.limitations` says so, and the day the
# sync exists the entry comes back here.
# One entry rather than two, since there is only one place the board is drawn now.
menu.entries             = open-pane=Show Board, -, reload=Reload Board
menu.submenu.new         = New
menu.submenu.new.entries = new-task=Task, new-epic=Epic, new-sprint=Sprint

# The page in Settings, which is where the database file is named.
settings.page = Agent-Tasks
settings.icon = board
