# An Unluminous plugin. See the Rust one for what the format is.
#
# `task-2384`. The language keys below are the code index's own manifest for Scala (atrius-index
# `languages/scala.conf`), so Go to Definition and completion read this language exactly as they did
# when the index was the only thing that knew it; what this plugin adds is the colors and the icon.
# Two index keys are left out, `definition_tail` and `brace_next_line`, because only the index reads them.

plugin.id          = scala
plugin.name        = Scala
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for Scala source files and scripts. Keywords, builtins, strings, numbers and comments are told apart, and the definitions the code index reads are found by Go to Definition.
plugin.limitations = A definition inside a pattern, such as val (a, b), is not found. The indentation based syntax of Scala 3 is folded by indentation.

language.extensions    = .scala, .sc
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.@

language.keywords = abstract, case, catch, class, def, do, else, enum, export, extends, false, final, finally, for, given, if, implicit, import, lazy, match, new, null, object, override, package, private, protected, return, sealed, super, then, this, throw, trait, true, try, type, using, val, var, while, with, yield
language.builtins = String, Int, Long, Double, Boolean, Unit, Any, List, Map, Set, Option, Some, None, println

language.definers = def=function, class=type, object=type, trait=type, enum=type, type=type, val=variable, var=variable, given=variable

# The structural reading (Unluminous task-2231): which blocks hold members and of what kind, how a
# type is written beside a name and after a parameter list, who may use a definition, and what reaches
# a member. Completion reads these to offer the members of a type, show what a function takes and
# returns, and know what a field or a variable holds. Every key is optional.
language.containers = class, object, trait, enum
language.records    = class
language.annotation = :
language.returns    = :
language.kinds      = class=class, object=class, trait=trait, enum=enum, type=alias
language.visibility = private, protected=crate
language.members    = .

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
