# An Unluminous plugin that draws. See the JavaScript one for what a language plugin is; this one opens a file
# type in tabs of its own instead of colouring it.
#
# `ui.provider` names code that shipped inside Unluminous. The arrangement below is data and can be changed
# by hand; the drawing cannot, which is what stops a manifest deciding the window's colours.

plugin.id          = word
plugin.name        = Word
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = ui
plugin.description = Microsoft Word documents. A .docx file opens as pages, the way Word's Print Layout shows it: the page size and margins, headers and footers, page numbers, tables, pictures, lists and footnotes. Type into it, format it, and save it, and Word opens the result as it is. There is no ribbon: a thin bar over the page holds the style, bold, italic, underline, a list and the alignment, the Aa and + buttons open a panel that drills down to every other setting, a small bar appears over selected text, typing / in an empty paragraph offers everything that can be inserted, Ctrl+/ finds any command by name, and Markdown habits work (# for a heading, - for a list). Misspelled and repeated words are underlined as you type, and a right click or F7 offers the spellings the dictionary suggests. Track Changes, comments, find and replace, a table of contents, word count, and export to PDF, HTML, Markdown and text are all here, and an agent reaches every one of them through plugins run word.
plugin.limitations = A .doc from Word 97-2003, an RTF, an ODT, a .wps and a PDF are opened by having Microsoft Word convert them, so they need Word installed; a .txt, .md or .html opens as a document with Open as Document. Spelling is checked in English only, with SCOWL's en_US dictionary; a run marked as another language is not checked. There is no grammar checker and no translation, because each needs a service Unluminous does not ship. SmartArt, charts and WordArt are kept exactly as they are in the file and drawn as their stored picture; they cannot be made here. Right to left and complex scripts are kept but drawn left to right without shaping. Page breaks are worked out with the same fonts Word uses, but two programs measure a font a fraction of a point apart, so a paragraph near the foot of a page can fall on the other page from Word's. Macros are never run.

ui.provider = word

# The file types this plugin opens in its own tabs, instead of a text tab. Switched off, they open as a tab
# that says they cannot be shown.
ui.extensions = .docx, .dotx, .docm, .dotm, .doc, .rtf, .odt, .wps

# The menu, added after Unluminous's own six. A lone `-` is a separator.
menu.name    = Word
menu.entries = new=New Word Document, open-as-document=Open as Document, -, export-pdf=Export as PDF, export-html=Export as HTML, export-md=Export as Markdown, -, track=Track Changes, accept-all=Accept All Changes, reject-all=Reject All Changes, -, spelling-next=Spelling, update-fields=Update Fields, stats=Word Count

# The page in Settings: the author name, the zoom a document opens at, whether formatting marks show, and
# whether spelling is checked as you type.
settings.page = Word
settings.icon = document
