# An Unluminous plugin. See the Rust one for what the format is.
#
# Java's `.properties` files: `name = value`, `name: value` or `name value`, with `#` or `!` for a
# comment. Spring Boot's `application.properties` is the one most people meet.

plugin.id          = properties
plugin.name        = Properties
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for Java .properties files. Comments written with # or !, the name each line sets, numbers and the boolean values are told apart.
plugin.limitations = A name separated from its value by a space alone, with no `=` or `:`, is read as plain text, because without a delimiter a name and the first word of a sentence look the same. A value continued onto the next line with a trailing backslash is read line by line, so the continuation is plain text. A `\uXXXX` escape is part of the plain value.

language.extensions    = .properties
# See the Python plugin for why a bare `#` is safe as this value.
language.line_comment  = #
language.more_line_comments = !
# A value is not quoted in a properties file, so a quote is an ordinary character.
language.strings       =
language.escapes       = false
language.numbers       = true
language.operators     = =:
language.keys          = =, :

language.builtins = true, false

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
