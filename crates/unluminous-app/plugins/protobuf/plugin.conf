# An Unluminous plugin. See the Rust one for what the format is.

plugin.id          = protobuf
plugin.name        = Protocol Buffers
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for Protocol Buffers .proto files. Keywords, the scalar types, field numbers, options, strings and both kinds of comment are told apart, and a message, an enum, a service and an rpc are found by Go to Definition.
plugin.limitations = A field's type that names another message is colored as a type only when it starts with a capital letter, which is the convention the style guide sets. A fully qualified name such as `google.protobuf.Timestamp` is three words joined by dots. An import's path is a string and is not followed to the file it names.

language.extensions    = .proto
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = =;{}[]<>(),.

language.keywords = syntax, edition, package, import, public, weak, option, message, enum, service, rpc, returns, stream, oneof, map, repeated, optional, required, reserved, extensions, extend, to, max, group
language.builtins = true, false, inf, nan
language.types = double, float, int32, int64, uint32, uint64, sint32, sint64, fixed32, fixed64, sfixed32, sfixed64, bool, string, bytes

language.definers = message=type, enum=type, service=type, rpc=function

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
