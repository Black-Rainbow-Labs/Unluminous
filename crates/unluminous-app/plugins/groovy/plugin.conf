# An Unluminous plugin. See the Rust one for what the format is.
#
# Groovy, and with it the Gradle build scripts every Java and Android project carries. `build.gradle`
# is Groovy; `build.gradle.kts` is Kotlin and is claimed by the Kotlin plugin through `.kts`.

plugin.id          = groovy
plugin.name        = Groovy
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for Groovy and for Gradle build scripts written in it. Keywords, the common Gradle blocks such as dependencies and plugins, strings of all three quote kinds, numbers and both kinds of comment are told apart, and a class, an interface, a trait and a method written with def are found by Go to Definition.
plugin.limitations = A triple quoted string and a slashy string run across lines and are colored on the first line only, which is the string rule every plugin here shares. Interpolation inside a double quoted string, `"${name}"`, is part of the string. A method declared with a return type rather than with def is found only by the brace rule, and marked as likely.

language.extensions    = .groovy, .gradle, .gvy, .gy, .gsh, .jenkinsfile
language.file_names    = Jenkinsfile, Jenkinsfile.*
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.@[]{}()

language.keywords = abstract, as, assert, boolean, break, byte, case, catch, char, class, const, continue, def, default, do, double, else, enum, extends, final, finally, float, for, goto, if, implements, import, in, instanceof, int, interface, long, native, new, package, private, protected, public, return, short, static, super, switch, synchronized, this, throw, throws, trait, transient, try, var, void, volatile, while, true, false, null

language.builtins = println, print, it, plugins, dependencies, repositories, implementation, api, compileOnly, runtimeOnly, testImplementation, testRuntimeOnly, annotationProcessor, classpath, buildscript, allprojects, subprojects, android, defaultConfig, buildTypes, sourceSets, task, tasks, mavenCentral, google, gradlePluginPortal, maven, version, group, apply, ext, pipeline, agent, stages, stage, steps, sh, bat, echo, environment, post

language.definers = class=type, interface=type, trait=type, enum=type, def=function
language.brace_definitions = true

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
