# An Unluminous plugin. See the Rust one for what the format is.
#
# HashiCorp's configuration language, which Terraform, OpenTofu, Packer, Nomad and Vault write their
# files in. It comments three ways, `#`, `//` and `/* */`, which `language.more_line_comments` is what
# makes possible. An attribute is `name = value`, and `language.keys` reads the name.

plugin.id          = hcl
plugin.name        = HCL (Terraform)
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for HCL: Terraform and OpenTofu configurations and variable files, Packer templates and Nomad jobs. The block types such as resource and variable, attribute names, the built in functions, the literal values, strings, numbers and all three kinds of comment are told apart.
plugin.limitations = Interpolation inside a string, `"${var.name}"`, is colored as part of the string. A heredoc (`<<EOT`) is read line by line, so its body is plain text. A block label such as the resource type in `resource "aws_instance" "web"` is colored as the string it is written as.

language.extensions    = .tf, .tfvars, .hcl, .nomad
language.file_names    = .terraformrc, terraform.rc
# See the Python plugin for why a bare `#` is safe as this value.
language.line_comment  = #
language.more_line_comments = //
language.block_comment = /*, */
language.strings       = "
language.escapes       = true
language.numbers       = true
language.operators     = =+-*/%<>!&|?:.,[]{}()
language.keys          = =

language.keywords = resource, data, variable, output, locals, module, provider, terraform, backend, required_providers, moved, import, removed, check, lifecycle, dynamic, content, provisioner, connection, for, in, if, for_each, count, depends_on, source, version, job, group, task, build, packer, run, assert, mock_provider

language.builtins = true, false, null, abs, ceil, floor, log, max, min, pow, signum, chomp, format, formatlist, indent, join, lower, regex, regexall, replace, split, strrev, substr, title, trim, trimprefix, trimsuffix, trimspace, upper, alltrue, anytrue, chunklist, coalesce, coalescelist, compact, concat, contains, distinct, element, flatten, index, keys, length, list, lookup, map, matchkeys, merge, one, range, reverse, setintersection, setproduct, setsubtract, setunion, slice, sort, sum, transpose, values, zipmap, base64decode, base64encode, csvdecode, jsondecode, jsonencode, urlencode, yamldecode, yamlencode, abspath, dirname, pathexpand, basename, file, fileexists, fileset, filebase64, templatefile, timestamp, timeadd, uuid, md5, sha1, sha256, cidrhost, cidrnetmask, cidrsubnet, cidrsubnets, can, try, tostring, tonumber, tobool, tolist, toset, tomap, sensitive, nonsensitive, var, local, each, self, path

language.types = string, number, bool, any, object, tuple, set

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
