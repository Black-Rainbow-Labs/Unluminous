# An Unluminous plugin. See the Rust one for what the format is.
#
# CMake's main file is always `CMakeLists.txt`, which has the extension every plain text file has, so
# it is claimed by name. A name beats an extension, so it is CMake while every other `.txt` file stays
# plain text.

plugin.id          = cmake
plugin.name        = CMake
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for CMake. Commands, the control flow commands, variable references, quoted arguments, numbers and comments are told apart.
plugin.limitations = The command names are matched in lower case, the way modern CMake is written; `ADD_EXECUTABLE(` is still colored as a call because a word directly before a bracket is one everywhere here. A bracket comment `#[[ ... ]]` is read as a line comment, so only its first line is a comment. `${VAR}` is colored by its punctuation and the name inside it is plain text. A function or a macro is not found by Go to Definition, because CMake writes its name inside the brackets, `function(name)`, and a definition is read as the word after the keyword.

language.extensions    = .cmake
language.file_names    = CMakeLists.txt, CMakeCache.txt
# See the Python plugin for why a bare `#` is safe as this value.
language.line_comment  = #
language.strings       = "
language.escapes       = true
language.numbers       = true
language.operators     = ${}()<>

language.keywords = if, elseif, else, endif, foreach, endforeach, while, endwhile, function, endfunction, macro, endmacro, return, break, continue, block, endblock, AND, OR, NOT, STREQUAL, EQUAL, LESS, GREATER, MATCHES, DEFINED, EXISTS, VERSION_LESS, VERSION_GREATER, VERSION_EQUAL, PRIVATE, PUBLIC, INTERFACE, REQUIRED, COMPONENTS, CACHE, PARENT_SCOPE

language.builtins = cmake_minimum_required, project, add_executable, add_library, add_subdirectory, add_custom_command, add_custom_target, add_compile_options, add_compile_definitions, add_definitions, add_dependencies, add_link_options, add_test, target_link_libraries, target_include_directories, target_compile_definitions, target_compile_options, target_compile_features, target_sources, target_link_options, include_directories, link_directories, link_libraries, find_package, find_library, find_path, find_program, find_file, include, set, unset, option, message, list, string, file, math, get_filename_component, set_target_properties, get_target_property, set_property, get_property, install, export, configure_file, execute_process, enable_testing, enable_language, FetchContent_Declare, FetchContent_MakeAvailable, ON, OFF, TRUE, FALSE, CMAKE_CXX_STANDARD, CMAKE_BUILD_TYPE, CMAKE_SOURCE_DIR, CMAKE_BINARY_DIR, CMAKE_CURRENT_SOURCE_DIR, CMAKE_CURRENT_BINARY_DIR, PROJECT_NAME, PROJECT_SOURCE_DIR


theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
