# An Unluminous plugin. See the Rust one for what the format is.
#
# `task-2384`. The language keys below are the code index's own manifest for Zig (atrius-index
# `languages/zig.conf`), so Go to Definition and completion read this language exactly as they did
# when the index was the only thing that knew it; what this plugin adds is the colors and the icon.
# Two index keys are left out, `definition_tail` and `brace_next_line`, because only the index reads them.

plugin.id          = zig
plugin.name        = Zig
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = language
plugin.description = Syntax coloring, a file icon and the Dracula color scheme for Zig source files and build.zig.zon manifests. Keywords, builtins, strings, numbers and comments are told apart, and the definitions the code index reads are found by Go to Definition.
plugin.limitations = A struct is defined by the constant it is assigned to, so it reads as a constant. A multi line string literal is read as text.

language.extensions    = .zig, .zon
language.line_comment  = //
language.strings       = ", '
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.@

language.keywords = addrspace, align, allowzero, and, anyframe, anytype, asm, async, await, break, callconv, catch, comptime, const, continue, defer, else, enum, errdefer, error, export, extern, fn, for, if, inline, linksection, noalias, noinline, nosuspend, opaque, or, orelse, packed, pub, resume, return, struct, suspend, switch, test, threadlocal, try, union, unreachable, usingnamespace, var, volatile, while, true, false, null, undefined
language.builtins = std, u8, u16, u32, u64, usize, i8, i16, i32, i64, isize, f32, f64, bool, void, type, anyerror

language.definers = fn=function, const=constant, var=variable

# The structural reading (Unluminous task-2231): which blocks hold members and of what kind, how a
# type is written beside a name and after a parameter list, who may use a definition, and what reaches
# a member. Completion reads these to offer the members of a type, show what a function takes and
# returns, and know what a field or a variable holds. Every key is optional.
language.members = .

theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
