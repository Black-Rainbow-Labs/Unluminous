[package]
name = "unluminous-sheet"
description = "Excel workbooks: the model, the .xlsx file, the formula language and its evaluator, number formats, CSV and every editing operation. No user interface dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The zip container an .xlsx file is. Both crates are already in the tree through other users, so the
# container costs nothing new; the zip format itself is read and written in `zip.rs`.
flate2.workspace = true
crc32fast.workspace = true
# Reading SpreadsheetML. Already in the tree. XML is written by hand with one escaping function.
roxmltree.workspace = true
# Sheet and workbook protection passwords are stored as Excel stores them: a salted SHA-512 hash, spun
# 100,000 times, in base64. All three crates are already in the tree through other users.
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
# Regular expressions for REGEXTEST, REGEXEXTRACT and REGEXREPLACE.
fancy-regex.workspace = true

[dev-dependencies]
# The oracle's answers are JSON lines written by PowerShell.
serde_json.workspace = true
