[package]
name = "unluminous-terminal"
description = "The terminal behind Unluminous's bottom tile: sessions over a pseudoterminal, the screen the painter reads, the colour palette and the key encoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "unluminous_terminal"
path = "src/lib.rs"

[dependencies]
alacritty_terminal.workspace = true
unicode-width.workspace = true

# `tcgetpgrp`, and nothing else: the one question that answers what program a terminal is really talking to,
# as opposed to what it was started with. See `src/foreground.rs` for why that difference matters and why
# Windows has no equivalent.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Job objects, and nothing else: the one promise Windows will make about a program outliving the
# terminal it was started in. See `src/reap.rs` for why a pseudoterminal closing is not that promise.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects"] }
