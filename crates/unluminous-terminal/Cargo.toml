[package]
name = "unluminous-terminal"
description = "The terminal behind Unluminous's bottom tile: sessions over a pseudoterminal, the screen the painter reads, the colour palette and the key encoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "unluminous_terminal"
path = "src/lib.rs"

[dependencies]
alacritty_terminal.workspace = true
polling.workspace = true
unicode-width.workspace = true

# `tcgetpgrp`, and nothing else: the one question that answers what program a terminal is really talking to,
# as opposed to what it was started with. See `src/foreground.rs` for why that difference matters and why
# Windows has no equivalent.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Job objects, and nothing else: the one promise Windows will make about a program outliving the
# terminal it was started in. See `src/reap.rs` for why a pseudoterminal closing is not that promise.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_JobObjects",
    # `task-1912`: a ConPTY has no foreground process group, so what a terminal node is running is read by
    # walking the process tree below the child the pseudoconsole was given. See `foreground`.
    "Win32_System_Diagnostics_ToolHelp",
    # `task-1945`: where the shell in a terminal has got to, read out of its own parameter block, so
    # a tab and a node come back in the folder somebody `cd`'d to rather than the one they started in.
    "Wdk_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    # `task-1950`: what this machine calls itself, so a `file://` URL naming another machine's folder is not
    # followed. Asked of the operating system because `COMPUTERNAME` is empty under Git Bash. See `reported`.
    "Win32_System_SystemInformation",
] }
