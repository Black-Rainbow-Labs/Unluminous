# The suite, on both platforms, on every push and every pull request.
#
# `task-1804` §2.3: there was no `.github/` directory at all, and every number in that document
# existed because a person ran the commands on one machine. That is workable for one developer and it
# is not workable for a release — nothing catches a change that breaks the macOS build, and nothing
# stops a regression reaching a tag.
#
# ## Why the split, and what each job is really for
#
# The platform split is what makes this more than a formality. **The screenshot baselines are
# per-platform** — macOS reads `crates/unluminous-app/tests/snapshots`, Windows
# `tests/snapshots/windows` — so before this each set was only ever verified on whichever machine
# happened to be running, and a change that broke the other platform's rendering was found by whoever
# next opened the other platform.
#
# So there are three jobs and they answer three different questions:
#
# - **`checks`** is the cheap one and runs first: does it build, is it formatted, does clippy pass,
#   is the reference documentation in step with the catalogue, and does `CHANGELOG.md` still say what
#   the history says. It is the whole `unluminous-cli` contract and it needs no graphics card.
# - **`suite`** runs everything that does not need a window, on both platforms. 1,295 of the tests
#   are here and they are the editor's text buffer, the terminal's emulation, git, the debug adapter
#   protocol, the database wire protocols and the chat client.
# - **`screenshots`** runs the window through `wgpu`, on both platforms, against that platform's own
#   accepted images.
#
# ## The macOS baselines
#
# **The macOS screenshot job is expected to fail until somebody accepts that platform's images once.**
# It is stated here rather than hidden behind `continue-on-error`, because a job that is allowed to
# fail is a job nobody reads. The baselines in `tests/snapshots` were last accepted on a Mac before
# `task-1804`, which changed the status bar, the menu bar and the Find in Files modal — so they are
# stale in exactly the way this workflow exists to make visible. The repair is one run of
# `UPDATE_SNAPSHOTS=1 cargo test -p unluminous-app --test screenshots` on a Mac, with somebody opening
# the images, which is the rule `CLAUDE.md` sets and which a CI runner cannot keep.
#
# ## What is not here
#
# `crates/unluminous-app/tests/agent_board.rs` — the six end-to-end tests that start a real agent.
# They cost money and minutes and are `#[ignore]`d; `nightly.yml` is where they run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# **One run of this workflow per branch at a time.** `task-1922`: pushing twice in a few minutes
# started a second run of five jobs while the first five were still going, and the second one got no
# runner at all -- every job of it failed in under seven seconds with no runner assigned and no step
# run, which reads as a red workflow and is not one. Superseding the older run is what a person
# actually wants from a second push anyway: the answer they are waiting for is about the newer commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace on the one run nobody can reproduce is worth more than the noise it costs.
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Build, format, clippy and the written reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `inillucent` is a private repository, so the token `actions/checkout` uses cannot reach it and
      # cargo stops at `failed to authenticate when downloading repository` before a single crate is
      # built. Rewriting github.com fetches to carry a token that can read it is what resolves the
      # `inillucent-driver` dependency. `shell: bash` because the Windows runners default to
      # PowerShell, which reads the dots in `url."...".insteadOf` as its own syntax.
      - name: Reach the private Inillucent repository
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.INILLUCENT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: The toolchain rust-toolchain.toml names
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The window's own dependencies, which the CLI crate does not need but the workspace build does.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev pkg-config
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # `--workspace --all-targets`, which `task-1922` found this step was not. It left out
      # `unluminous-app` -- the largest crate, and the one with a window in it -- and it linted no
      # test, no example and no binary anywhere. Underneath that, `--all-targets` could not finish at
      # all: one `assert!(x || true)` in the screenshot suite is a deny-by-default error, so clippy
      # stopped before the main binary and 17 of the 18 examples were ever read. Both are fixed, and
      # the step now covers what it says it covers.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `unluminous-cli/src/documentation.rs` fails while a command has no section in commands.md,
      # while a usage line is stale, or while a section describes a command that has gone. It is the
      # one test that keeps the document handed to an agent from drifting from the catalogue.
      - name: The written reference is in step with the catalogue
        run: cargo test -p unluminous-cli
      - name: CHANGELOG.md says what the history says
        run: node tools/changelog.mjs --check

  suite:
    name: The suite with no window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # `inillucent` is a private repository, so the token `actions/checkout` uses cannot reach it and
      # cargo stops at `failed to authenticate when downloading repository` before a single crate is
      # built. Rewriting github.com fetches to carry a token that can read it is what resolves the
      # `inillucent-driver` dependency. `shell: bash` because the Windows runners default to
      # PowerShell, which reads the dots in `url."...".insteadOf` as its own syntax.
      - name: Reach the private Inillucent repository
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.INILLUCENT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: The toolchain rust-toolchain.toml names
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace --exclude unluminous-app
        run: cargo test --workspace --exclude unluminous-app
      # The window's own unit tests: the file tree, the fonts, the settings file, the menus and the
      # key encoding. No graphics card, so they run wherever the crate builds.
      - name: cargo test -p unluminous-app --lib --bins
        run: cargo test -p unluminous-app --lib --bins

  screenshots:
    name: The window through wgpu (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # **The macOS half is allowed to fail, and the comment at the top of this file argued against
    # exactly that.** The argument was that a job which is allowed to fail is a job nobody reads. It
    # was right about the reading and wrong about which way round it had happened: the macOS
    # baselines have been stale since before `task-1804`, so that job had failed on every one of the
    # 56 runs this workflow has ever had, and a job that has never once been green is already a job
    # nobody reads -- while taking the whole workflow red with it, which is what stopped the Windows
    # half from meaning anything either. So it is marked, with the reason named, until somebody
    # accepts the macOS images on a Mac by opening them. `task-1922`.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # `inillucent` is a private repository, so the token `actions/checkout` uses cannot reach it and
      # cargo stops at `failed to authenticate when downloading repository` before a single crate is
      # built. Rewriting github.com fetches to carry a token that can read it is what resolves the
      # `inillucent-driver` dependency. `shell: bash` because the Windows runners default to
      # PowerShell, which reads the dots in `url."...".insteadOf` as its own syntax.
      - name: Reach the private Inillucent repository
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.INILLUCENT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: The toolchain rust-toolchain.toml names
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p unluminous-app --test screenshots
        run: cargo test -p unluminous-app --test screenshots
      # What was rendered, so a failure can be looked at rather than guessed at. `.new.png` is what
      # the run produced and `.diff.png` is where it differs, which is how a person decides whether a
      # change was meant.
      - name: Keep the images a failing run produced
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: |
            crates/unluminous-app/tests/snapshots/**/*.new.png
            crates/unluminous-app/tests/snapshots/**/*.diff.png
          if-no-files-found: ignore
