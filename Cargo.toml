[workspace]
resolver = "2"
members = ["crates/unluminous-core", "crates/unluminous-chat", "crates/unluminous-db", "crates/unluminous-dap", "crates/unluminous-lsp", "crates/unluminous-git", "crates/unluminous-terminal", "crates/unluminous-jupyter", "crates/unluminous-word", "crates/unluminous-sheet", "crates/unluminous-voice", "crates/unluminous-app", "unluminous-cli"]
# A crate taken from crates.io and changed here, through `[patch.crates-io]` below. Not a member, so the
# workspace's lints, tests and formatting leave it as its authors wrote it.
exclude = ["vendor"]

[workspace.package]
version = "1.21.3"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
unluminous-core = { path = "crates/unluminous-core" }
unluminous-chat = { path = "crates/unluminous-chat" }
unluminous-db = { path = "crates/unluminous-db" }
unluminous-dap = { path = "crates/unluminous-dap" }
unluminous-lsp = { path = "crates/unluminous-lsp" }
unluminous-git = { path = "crates/unluminous-git" }
unluminous-terminal = { path = "crates/unluminous-terminal" }
unluminous-jupyter = { path = "crates/unluminous-jupyter" }
# Word documents for the Word plugin: the model, the .docx file, editing, pagination and the exports.
# `task-2341`.
unluminous-word = { path = "crates/unluminous-word" }
# Excel workbooks for the Spreadsheet plugin: the model, the .xlsx file, formulas and their evaluator.
# `task-2338`.
unluminous-sheet = { path = "crates/unluminous-sheet" }
# The zip container and the XML reader a workbook and a .docx file need. All three were already in the lock file
# through other crates, so naming them here adds nothing.
flate2 = "1.1"
crc32fast = "1.5"
roxmltree = "0.20"
# The regular expressions REGEXTEST, REGEXEXTRACT and REGEXREPLACE run. Excel supports lookaround, back references and
# atomic groups, which the `regex` crate does not, so the pattern goes to `fancy-regex`, which hands the parts that are
# plain regular expressions to `regex` and runs the rest with a limit on how much it may backtrack.
fancy-regex = "0.14"
ttf-parser = "0.25"
spellbook = "0.4.2"
# Knuth-Liang hyphenation with the en-US TeX patterns embedded, for the Word plugin (task-2359, M9).
hyphenation = { version = "0.8.4", default-features = false, features = ["embed_en-us"] }
# HTML on the clipboard, read the way a browser reads it: html5ever's tree builder. Already in the tree.
dom_query = { version = "0.28", default-features = false }
# Pictures in a Word document that are not bitmaps (task-2359, TDD 5.3): an EMF or WMF is turned into
# SVG by emf-core, and an SVG is drawn by resvg at the size the page shows it. No network, no fonts
# beyond the machine's own.
emf-core = { version = "0.1.1", default-features = false, features = ["svg"] }
# A Word document encrypted with a password (task-2359, TDD 5.6): ECMA-376 agile encryption, AES-256 in
# CBC mode inside an OLE compound file. The RustCrypto crates match the `sha2` and `hmac` already here.
aes = "0.8.4"
cbc = "0.1.2"
cfb = "0.10.0"
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Speech to text for the Agent-Chat prompt: the microphone, the "Sable" wake word, the local Moonshine model
# and an OpenAI compatible endpoint. `task-2290`.
unluminous-voice = { path = "crates/unluminous-voice" }
# The code index is Atrius, its own product since task-2172: the engine, the index host and the wire
# protocol. `unluminous-cli/src/search.rs` is the seam. `crates/unluminous-index` is the copy it was
# made from and is no longer built.
atrius-index = "0.3.2"
# The command catalogue and the wire format the CLI and the window share. It lives beside the client
# it belongs to rather than under `crates`, because `unluminous-cli/` holds the CLI's documentation as
# well as its code and the two are read together.
unluminous-cli = { path = "unluminous-cli" }
# `kill(pid, 0)` and nothing else: the one question a window asks about another window that owns a ticket's
# worker, which is whether it is still running.
libc = "0.2"
unicode-segmentation = "1.13"
# The Agent-Tasks plugin's database. `bundled` compiles SQLite's own C into Unluminous, so there is nothing
# to install, no server to be running and no port: the board is one file. See
# `tasks/agent-tasks-plugin-tdd.md` for why this rather than the PostgreSQL the application being
# replaced needs. Nothing is fetched at run time, which is the rule the whole repository keeps.
# `column_decltype` is added by the Database plugin: it is a pure feature flag with no dependency
# behind it, and it is what lets a result grid name the type of each column rather than leaving every
# one blank. Features are additive, so the Agent-Tasks board is unchanged by it.
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
# The control channel speaks JSON, one object a line. Written by hand rather than with the derive
# macros: nothing here is a Rust type going over the wire, it is a small open protocol another
# language has to be able to speak, so the values are built and read as values.
serde_json = "1.0"
# The one HTTP client in the tree, for the Agent-Chat plugin and nothing else. Blocking rather than
# async, because Unluminous has no runtime: `unluminous_git::Worker`, the terminal's reader, `text_search`,
# `symbol_index` and `unluminous_dap` are all plain threads with channels, and a runtime added for one
# pane would be a second concurrency model in a program that has one.
#
# **`native-tls` rather than rustls**, which is schannel on Windows and Security.framework on macOS:
# the certificates Unluminous trusts are then the certificates the machine trusts, so a request from Unluminous
# reaches the same servers `curl` reaches, including behind whatever inspects the traffic on a
# corporate network. That is `unluminous-git`'s argument for shelling out to the machine's real git rather
# than linking a git library, made about a certificate store instead of a credential helper. Measured:
# 31 crates in the tree against 121 for rustls with its own root store.
#
# `gzip`, `json`, `cookies`, `multipart` and the proxies are off. Nothing here posts a form or keeps a
# cookie, and the bodies are built and read as `serde_json::Value`s by hand — the rule
# `services::control` already keeps for the control channel.
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
# The Database plugin's client, and the four crates it needs that are not already in the tree by
# another route. `sha2` arrives through `wry`, `base64` through `alacritty_terminal`, `native-tls`
# through `ureq` and `getrandom` through several — so naming them here costs nothing new, and the
# whole PostgreSQL client adds `hmac` and `md-5`. See `tasks/task-1777-database-plugin-tdd.md` §2.1
# for the count and for why `tokio-postgres` was refused.
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
base64 = "0.22"
getrandom = "0.3"
native-tls = "0.2"
# The Inillucent engine, reached through **its own driver** rather than through its internals. The
# driver depends on `inillucent-engine` and nothing else in that workspace, which is the whole point of
# it: the engine's rearchitecture is still moving crates underneath, and a consumer holding the driver
# is unaffected by all of it. A released version from crates.io rather than a path, because a release
# built from whatever a sibling folder happens to hold on one machine is not a release —
# `tasks/task-1814-inillucent-data-source-tdd.md` §1. It was a git commit until 2.0.2 was published.
# Both release scripts run `cargo update -p inillucent-driver` first, so a release always takes the newest
# 2.x (`task-2293`).
#
# `embed` turns on the SQL `embed()` function the code index uses for its passage vectors
# (`tasks/task-2138-unluminous-code-index-tdd.md` R1). ONNX Runtime is loaded when `embed()` first runs
# rather than linked, so a machine with no model installed builds and runs the same binary, and
# `embed()` answers `invalid_state` there. Nothing is downloaded by Unluminous.
inillucent-driver = { version = "2.8.1", features = ["embed"] }
# Black Rainbow Labs' component library, for the controls Unluminous takes from it rather than drawing a
# second copy: the Agent-Chat model selector is its `Select` (`task-2096`). It is built on the same egui
# 0.36 and the same `vello_cpu` with the same features, so it adds no second renderer. Pinned to a commit
# for the reason `inillucent-driver` is.
rux = { git = "https://github.com/Black-Rainbow-Labs/black-rainbow-labs-rux.git", rev = "d451baba34d6deec62a58938e3865a6d253ea97e" }
url = "2.5"
percent-encoding = "2.3"
mime_guess = "2.0"
wry = { version = "0.56.1", default-features = false, features = ["os-webview"] }
# The board's decoration: soft shadows, inset shadows and gradients, which `epaint` cannot draw. The CPU
# renderer of the three Vellos, because it is the only one that can go in a window on egui 0.36 at all:
# `vello` and `vello_hybrid` both pin wgpu 29 and eframe pins wgpu 30, so their devices and textures are
# different types. It renders into premultiplied RGBA8, which is `egui::Color32` byte for byte, and it is
# deterministic, which is what the screenshot tests rest on. See `tasks/agent-tasks-vello-ui-tdd.md`.
#
# **The version is epaint's, and it has to be.** `epaint` 0.36 already depends on `vello_cpu` 0.1 — it
# rasterises the glyphs in its font atlas with it — so this renderer is already inside Unluminous and asking
# for 0.2 would put a second copy of it in the binary rather than adding a renderer. Follow epaint when
# egui is next upgraded.
#
# **And `multithreading` must stay off, which was measured rather than assumed.** It is the one big lever
# left — rasterising is per pixel and embarrassingly parallel, and turning it on took a board of four lanes
# and thirty-two cards from 20.1 ms to 5.5. It cannot be used. Cargo features are additive across the whole
# graph, so enabling it changes `RenderSettings::default()` for **epaint too** — and `epaint`'s glyph
# rasteriser builds its context with the default settings and never calls `flush()`, which the multithreaded
# dispatcher requires. Every screenshot test panicked inside `vello_cpu` with "attempted to rasterize before
# flushing", from egui's own text. See `tasks/agent-tasks-vello-ui-tdd.md` §9.
vello_cpu = { version = "0.1", default-features = false, features = ["std", "u8_pipeline"] }
egui = "0.36"
# `accesskit` builds the accessibility tree the operating system's screen reader reads: Narrator and
# UI Automation on Windows, VoiceOver and NSAccessibility on macOS. It was **off**, and the whole of
# what that cost is that the 112 `widget_info` calls already in `components/` reached nothing at all
# in the shipped binary -- every control in Unluminous has carried a name since `task-1655`, and no
# screen reader could read one of them. `task-1804` §3.4; `design/accessibility.md` is what is
# still missing.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
fontdb = "0.24"
ab_glyph = "0.2"
# A Realm's sound nodes. `task-2202`, §5.4 of `tasks/task-2199-realm-tdd.md`. Pure Rust: `cpal` for the output
# device and `symphonia` for the decoders, so it builds on Windows and macOS with no SDK and fetches nothing
# when it runs. Only playback, and only the formats a sound node offers: MP3, FLAC, Ogg Vorbis, WAV, and AAC
# or Apple Lossless in an MP4 container for `.m4a`. No recording, so no microphone permission is ever asked for.
#
# **`symphonia-alac` is not part of `mp4`.** rodio's `mp4` feature turns on the MP4 reader and the AAC decoder
# only, so an `.m4a` holding Apple Lossless, which is what iTunes and Apple Music write for a lossless
# import, was refused with "The format of the data has not been recognized". `task-2207`.
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "mp4", "symphonia-alac"] }
arboard = "3.6"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "ico",
    "webp",
    "tiff",
] }
rfd = "0.17"
muda = "0.19"
alacritty_terminal = "0.26"
# The three types `alacritty_terminal::tty::EventedReadWrite` names in its own signatures, and nothing else.
# `task-1950` puts a wrapper between `EventLoop` and the pseudoterminal so the bytes a shell writes can be read
# for the sequence it reports its own folder with, and a wrapper cannot implement a trait without naming the
# types in it. It is already in the tree: `alacritty_terminal` depends on it, so this adds no crate at all.
polling = "3.8"
unicode-width = "0.2"
winresource = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # The window's own border, which Windows 11 draws outside the rounded corners. See
    # `services/windows_transparency.rs`.
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    # Deleting a file to the Recycle Bin, which is `SHFileOperationW`. See `services/recycle.rs`.
    "Win32_UI_Shell",
    # The Windows credential store, which is `CredWriteW`, `CredReadW` and `CredDeleteW`. See
    # `services/agent_tasks/keychain.rs`.
    "Win32_Security_Credentials",
    # `OpenProcess`, the Windows half of `owner_is_gone`'s `kill(pid, 0)` question. See
    # `services/agent_tasks/mod.rs`.
    "Win32_System_Threading",
    # `AttachConsole` and `SetStdHandle`, which is how a program in the windows subsystem answers
    # `--version` into the terminal that asked. See `services/console.rs`.
    "Win32_System_Console",
    # `CreateFileW`, for `CONOUT$` in the same place.
    "Win32_Storage_FileSystem",
    # `GetDpiForWindow`, which is how a browser node's crop is measured in the same physical pixels
    # `wry` places the view in. See `services::browser`'s `clip_to_the_visible_part`.
    "Win32_UI_HiDpi",
    # `GetFocus`, which is how the window asks whether the keyboard is its own or a native child's
    # rather than believing `winit`'s cache of it. See `services/windows_focus.rs`.
    "Win32_UI_Input_KeyboardAndMouse",
    # The clipboard's list of files, `CF_HDROP`, which is how a file copied in Explorer is pasted into
    # the folder pane and one copied there is pasted in Explorer. See `services/system_files.rs`.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # `GetLocalTime`, the time of day a notebook cell finished at. See `services/clock.rs`.
    "Win32_System_SystemInformation",
    # `RegGetValueW`, the Windows version a reported issue names. See `services/issue_report.rs`.
    "Win32_System_Registry",
    # `GetUserDefaultLocaleName`, which decides whether a new Word document is Letter or A4. See
    # `services/word/files.rs`.
    "Win32_Globalization",
    # `CryptProtectData`, which encrypts the browser's session cookies for the current user the way
    # Chromium encrypts its own. See `services/browser_session.rs`.
    "Win32_Security_Cryptography",
    # A job object that ends every language server when the window's process ends, however it ends.
    # See `unluminous-lsp`'s `worker.rs`.
    "Win32_System_JobObjects",
    # `PrintWindow`, a picture of a browser node's page that the canvas draws while its zoom moves. See
    # `services::browser::BrowserHost::photograph`.
    "Win32_Storage_Xps",
    # `QueryThreadCycleTime` and `PROCESSOR_NUMBER`: how much of a frame the window's thread was running, and
    # on which kind of processor. See `services/thread_clock.rs`.
    "Win32_System_WindowsProgramming",
    "Win32_System_Kernel",
    # `timeBeginPeriod`, the window's one millisecond timer. See `services/scheduling.rs`.
    "Win32_Media",
] }
# Already in the tree under `wry`, at the versions `wry` uses; named here because a browser node adds
# `Select Element` to WebView2's own right click menu, which `wry` does not wrap. See
# `services/browser.rs`'s `context_menu`.
webview2-com = "0.38"
windows = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_System_Com"] }
windows-core = "0.61"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSProcessInfo",
    "NSString",
] }
# Already in the tree under `objc2-foundation`; named here because `services/system_files.rs` sends
# AppKit messages directly, for the pasteboard's files and for where the pointer is during a drop.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
# Already in the tree under the objc2 crates; named here because `services/wake.rs` uses it directly.
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }

# Line numbers and nothing else in the debug information of a test build (`task-2240`). Every window
# test binary links all of `unluminous-app` and wrote a 699 MB PDB beside a 125 MB executable; with
# line tables only that is 292 MB, and the rebuild of the whole window suite after a one line change
# to `unluminous-app` went from 32.6 s to 15.3 s, on the same 80% processor share. A panic still names
# its file and line. What is lost is a debugger's view of local variables inside a test binary.
# `[profile.dev]` is left as it was, so `cargo run` and a debugger on the application are unchanged;
# the cost is that a dev build and a test build no longer share their dependencies' artifacts.
[profile.test]
debug = "line-tables-only"

# **Dependencies are optimized in a test build; this workspace's own crates are not (`task-2364`).** A window
# test spends its time in code that is not ours: egui laying a frame out, `vello_cpu` and `rux` rasterizing
# the decoration, `image` reading and comparing pictures. Unoptimized, one frame of the forty-card AI
# Configuration page took seconds, and `the_acp_registry_is_cards_that_add_and_remove_an_agent` took 157 s
# alone. Rust does not reorder floating point arithmetic at any optimization level and `vello_cpu`'s SIMD
# level is pinned in a test window (`draw_deterministically`), so the accepted pictures do not move. A panic
# in our code still names its file and line, because our crates keep `opt-level = 0`.
[profile.test.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
# Thin rather than fat, and the default number of codegen units rather than one, because `task-1805`
# measured what the other setting buys and it is only the file size. `lto = "fat"` with
# `codegen-units = 1` takes `unluminous.exe` from **29.9 MB to 26.8 MB** and `unluminous-cli.exe` from
# 1.29 to 1.0 -- and moves **nothing** that anybody can feel: startup 738 ms against 734, a keystroke
# on a 380 KB file 2.498 ms against 2.508, working set 220.4 MB against 220.9. What it costs is the
# build, from **52 seconds to 4 minutes 25**, five times over, on a repository whose rule is that
# finishing a task means running a release build. A tenth off the installer is worth having and it is
# not worth that; the numbers are here so the trade can be made again rather than argued.
lto = "thin"

# **egui-wgpu 0.36.1 with one change** (`task-2288`): with `WgpuConfiguration::scene_texture` on, every frame is
# drawn into a texture of its own and copied to the window, and that texture is handed to paint callbacks before
# they are prepared, when it still holds the previous frame. It is what the screenshot path already did on the
# frames it captured. A modal's backdrop is the previous frame blurred on the GPU (`services::scene_blur`), where it
# was a screenshot read back, converted pixel by pixel and blurred on the window's thread. The same change moves
# that pixel conversion off the window's thread for `window screenshot`. `vendor/egui-wgpu/UNLUMINOUS.md` says what
# changed and how to carry it to the next egui.
[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }
# wgpu-hal 30.0.1 with one change (`task-2369`): DX12 copies a shader compiled by FXC out of its `ID3DBlob`
# before caching it. That blob does not count its references atomically, and the per-device shader cache
# handed clones of one blob to every thread making the same pipeline, so the blob was freed while still
# cached and a window test binary aborted reading it. `vendor/wgpu-hal/UNLUMINOUS.md` has the measurement.
wgpu-hal = { path = "vendor/wgpu-hal" }
